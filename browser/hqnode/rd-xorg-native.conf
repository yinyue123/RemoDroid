# The remote browser's screen (native: 3x, 427x923 CSS px; too heavy for the OECT): the iPhone 14 Plus's shape (214:463) in multiples of 16, which the
# encoders need. No real input devices: the touch screen is the inputtest driver, fed by
# remodroid-desktopd ([input] touch = inputtest:/run/rd-touch.sock); keys come in through XTest.
# Tested with Xorg 21.1 without /dev/tty0, /dev/dri or /dev/input, in a user namespace (remote-browser-plan.md).
Section "ServerFlags"
  Option "AutoAddDevices" "false"      # no udev in the container; only the device below
  Option "AutoEnableDevices" "false"
  Option "DontVTSwitch" "true"
EndSection
Section "Device"
  Identifier "dummy"
  Driver "dummy"
  VideoRam 32768
EndSection
Section "Monitor"
  Identifier "mon"
  HorizSync 5.0-1000.0
  VertRefresh 5.0-200.0
  # a real CVT line: hand-made short blanking is refused and Xorg falls back to 640x480
  Modeline "1280x2768"  146.00  1280 1368 1504 1728  2768 2771 2781 2818 -hsync +vsync   # cvt 1280 2768 30: at 60 Hz the clock is over the dummy driver's 300 MHz
EndSection
Section "Screen"
  Identifier "screen"
  Device "dummy"
  Monitor "mon"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1280x2768"
    Virtual 1280 2768
  EndSubSection
EndSection
Section "InputDevice"
  Identifier "touch"
  Driver "inputtest"
  Option "SocketPath" "/run/rd-touch.sock"
  Option "DeviceType" "Touch"
  Option "TouchCount" "5"              # navigator.maxTouchPoints; 5 is what iPhones report
EndSection
Section "ServerLayout"
  Identifier "layout"
  Screen "screen"
  InputDevice "touch"
EndSection
