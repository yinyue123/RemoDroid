# The remote browser's screen (small: 2x, 392x808 CSS px): the iPhone 14 Plus's screen below its status bar (428x879 pt: the Home Screen app's area, which no page can
# take the status bar from) in multiples of 16, which the
# encoders need. No real input devices: the touch screen is the inputtest driver, fed by
# remodroid-desktopd ([input] touch = inputtest:/run/rd-touch.sock); keys come in through XTest.
# Tested with Xorg 21.1 without /dev/tty0, /dev/dri or /dev/input, in a user namespace (remote-browser-plan.md).
Section "ServerFlags"
  Option "AutoAddDevices" "false"      # no udev in the container; only the device below
  Option "AutoEnableDevices" "false"
  Option "DontVTSwitch" "true"
EndSection
Section "Device"
  Identifier "dummy"
  Driver "dummy"
  VideoRam 32768
EndSection
Section "Monitor"
  Identifier "mon"
  HorizSync 5.0-1000.0
  VertRefresh 5.0-200.0
  # a real CVT line: hand-made short blanking is refused and Xorg falls back to 640x480
  Modeline "784x1616"  107.50  784 848 928 1072  1616 1619 1629 1675 -hsync +vsync   # cvt 784 1616 60
EndSection
Section "Screen"
  Identifier "screen"
  Device "dummy"
  Monitor "mon"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "784x1616"
    Virtual 784 1616
  EndSubSection
EndSection
Section "InputDevice"
  Identifier "touch"
  Driver "inputtest"
  Option "SocketPath" "/run/rd-touch.sock"
  Option "DeviceType" "Touch"
  Option "TouchCount" "5"              # navigator.maxTouchPoints; 5 is what iPhones report
EndSection
Section "ServerLayout"
  Identifier "layout"
  Screen "screen"
  InputDevice "touch"
EndSection
