# The remote browser's sound (units/rd-pipewire.service: PipeWire as user pulse, XDG_CONFIG_HOME=/etc/rd-browser).
# "browser" is the sink the desktop agent records (browser.monitor) and sends to the viewer; the AirPlay
# speakers avahi finds on the LAN port (rd-lan) are sinks too, raop_sink.<host>.<address>.<port>, and the
# bar's Sound page picks one. browser/airplay.md says how a session with a speaker goes.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "browser"
      node.description = "This phone"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
      audio.rate       = 48000
      # the default at start, over any speaker found: a speaker plays only when the Sound page picks it
      priority.session = 3000
    }
  }
]

context.modules = [
  # One sink per _raop._tcp speaker on lan0. raop.latency.ms is how far behind the speaker plays (the
  # sync packets say so): the module's default is 1500, its floor 250. 500 starts a track about 0.75 s
  # after the tap and has played steadily to the HomePod mini; raise it if the sound drops out.
  { name = libpipewire-module-raop-discover
    args = { raop.latency.ms = 500 }
  }
]
