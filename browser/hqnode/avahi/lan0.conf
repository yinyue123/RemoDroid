# avahi for the LAN port (rd-lan) alone: allow-interfaces=lan0 (avahi-daemon.conf), so without the port it
# finds nothing. No ConditionPathExists=/sys/class/net/lan0: hqnode moves the port in just after the
# container starts, and a check before then left AirPlay off (2026-11-02); avahi notices it arrive.
[Unit]
After=rd-lan.service
