# /etc/avahi/avahi-daemon.conf in the remote browser: avahi finds AirPlay speakers on the LAN port
# (rd-lan) for the sound server's discovery, and tells the LAN nothing about this container.
[server]
use-ipv4=yes
use-ipv6=no
allow-interfaces=lan0
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=yes
disable-user-service-publishing=yes

[reflector]
enable-reflector=no

[rlimits]
