name: browser-sx

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [install, update, configure]
        default: install
        description: Install, update while keeping data, or configure the existing container
      image_run:
        description: Use the amd64 image from this successful browser-image run instead of rebuilding
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: browser-sx

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
        if: inputs.mode != 'configure' && inputs.image_run == ''
      - name: Build the amd64 hqnode browser
        if: inputs.mode != 'configure' && inputs.image_run == ''
        run: |
          mkdir pkgs
          docker buildx build --platform linux/amd64 --build-arg CLOAKBROWSER=free \
            -f browser/hqnode/Dockerfile -t localhost/remote-browser-hqnode:amd64 \
            --output type=oci,dest=pkgs/remote-browser-amd64.tar .
      - name: Fetch the existing amd64 image
        if: inputs.mode != 'configure' && inputs.image_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_RUN: ${{ inputs.image_run }}
          KEY: ${{ secrets.BROWSER_IMAGE_KEY }}
        run: |
          mkdir -p pkgs image
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN" > pkgs/image-meta.json
          python3 -c 'import json; d=json.load(open("pkgs/image-meta.json")); assert d["conclusion"] == "success" and d["path"] == ".github/workflows/browser-image.yml"'
          gh run download "$IMAGE_RUN" -R "$GITHUB_REPOSITORY" -n remote-browser-amd64 -D image
          (cd image && sha256sum -c remote-browser-amd64.tar.enc.sha256)
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY \
            -in image/remote-browser-amd64.tar.enc -out pkgs/remote-browser-amd64.tar
      # CloakBrowser stays on the runner and the user's machines; no public image or artifact.
      - name: Prepare the deployment
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p pkgs
          printf '%s\n' "$MODE" > pkgs/mode
          cp browser/hqnode/install-sx.py pkgs/browser-install.py
          cp browser/hqnode/rd-lan pkgs/
          cp browser/host/rd-killswitch browser/host/rd-killswitch.service pkgs/
          (cd pkgs && sha256sum mode browser-install.py rd-lan rd-killswitch rd-killswitch.service > SHA256SUMS)
          if [ -f pkgs/remote-browser-amd64.tar ]; then
            (cd pkgs && sha256sum remote-browser-amd64.tar >> SHA256SUMS)
          fi
          if [ -f pkgs/image-meta.json ]; then
            (cd pkgs && sha256sum image-meta.json >> SHA256SUMS)
          fi
      - name: Install browser-sx through nl
        timeout-minutes: 10
        env:
          KEY: ${{ secrets.BROWSER_SX_DEPLOY_KEY }}
          HOST: ${{ secrets.BROWSER_SX_DEPLOY_HOST }}
          PORT: ${{ secrets.BROWSER_SX_DEPLOY_PORT }}
          KNOWN: ${{ secrets.BROWSER_SX_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          for attempt in 1 2 3; do
            if tar -C pkgs -c . | ssh -i ~/.ssh/deploy -p "$PORT" \
              -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "$HOST" browser-sx; then
              exit 0
            fi
            sleep 3
          done
          exit 1
