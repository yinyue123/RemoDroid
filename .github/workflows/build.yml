# Builds RemoDroid for every target and packages it:
#   static binaries  x86, x86_64, armv7, aarch64 (+ the agent alone for mipsel, mips routers)
#   phone files      remodroid-server.jar + libremodroid.so (arm64-v8a, armeabi-v7a)
#   desktop agents   Linux (x86_64, aarch64), Windows (x86_64, arm64), macOS (universal2):
#                    libremodroid + the tray / menu bar app (multi-platform.md)
#   server, Windows  remodroid-server.exe + the tray app RemoDroidServer.exe (x86_64, arm64), tested as a service
#   packages         .deb, .rpm, .apk, .ipk (OpenWrt, agent only), .tar.gz, Merlin agent offline installers,
#                    RemoDroid-Server-*-windows-*.zip,
#                    remodroid-desktop .deb/.rpm/.tar.gz, RemoDroid-*-linux-*.AppImage, RemoDroid-*-windows-*.zip,
#                    RemoDroid-*-macos.zip
# A pushed tag v* publishes a GitHub release; the annotated tag's message is the release notes.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  PEBBLE_VERSION: v2.10.1 # Let's Encrypt's ACME test server, for tests/tls.mjs
  PEBBLE_SHA256: 4f2fcb5bca8c85c9cf73ad140fccfc0d2be40bd81ab99879c79b7b8a0b4f70ed
  CHALLTESTSRV_SHA256: e93a5aa25ecdf3af2f9fbb2de32b0173e64a2eae81002a4ccfe35fa6f4f60b92
  NFPM_VERSION: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
  APPIMAGETOOL_VERSION: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_VERSION: '20251108' # AppImage/type2-runtime, the AppImages' static runtime
  APPIMAGE_RUNTIME_X86_64_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  APPIMAGE_RUNTIME_AARCH64_SHA256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444

jobs:
  test:
    name: test (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: make -j"$(nproc)"
      - name: End-to-end control plane tests
        run: node tests/run.mjs build/host
      - name: Install Pebble (ACME test CA)
        run: |
          mkdir -p "$RUNNER_TEMP/pebble"
          for n in pebble:PEBBLE_SHA256 pebble-challtestsrv:CHALLTESTSRV_SHA256; do
            name=${n%%:*}; sum=$(printenv "${n##*:}")
            curl -fsSL -o "/tmp/$name.tgz" "https://github.com/letsencrypt/pebble/releases/download/${PEBBLE_VERSION}/$name-linux-amd64.tar.gz"
            echo "$sum  /tmp/$name.tgz" | sha256sum -c -
            tar -C "$RUNNER_TEMP/pebble" -xzf "/tmp/$name.tgz"
          done
          chmod +x "$RUNNER_TEMP"/pebble/*/linux/amd64/*  # the release tarballs drop the execute bit
          echo "PEBBLE_DIR=$RUNNER_TEMP/pebble" >> "$GITHUB_ENV"
      - name: HTTPS, wss and ACME tests
        run: node tests/tls.mjs build/host
      - name: Setup wizard and router enrollment tests
        run: node tests/setup.mjs build/host
      - name: AI control SDK, rd CLI and skill runner tests
        run: python3 tests/python_sdk.py
      - name: Merlin agent packaging and lifecycle tests
        run: |
          python3 tests/merlin.py
          node --check packaging/merlin/deploy/res/remodroid.js
      - name: Cloudflare Worker tests (wrangler dev)
        run: |
          (cd worker && npm install --no-audit --no-fund)
          node tests/worker.mjs build/host
      - name: Install site uses the panel's stylesheet
        run: cmp web/setup.css wizard/setup.css

  binaries:
    name: binaries (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64, armv7, aarch64, mipsel, mips]
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        run: |
          curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -C "$RUNNER_TEMP/zig" --strip-components=1 -xf /tmp/zig.tar.xz
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build static binaries
        run: ./build/dist.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.arch }}
          path: build/out/${{ matrix.arch }}/
          if-no-files-found: error

  phone:
    name: phone files (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build jar and native libraries
        run: |
          export ANDROID_JAR="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar"
          export D8="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/d8"
          export NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "android.jar: $ANDROID_JAR"; echo "d8: $D8"; echo "NDK: $NDK"
          ./android/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: phone
          path: |
            build/android/remodroid-server.jar
            build/android/arm64-v8a/libremodroid.so
            build/android/armeabi-v7a/libremodroid.so
          if-no-files-found: error

  desktop-linux:
    name: desktop (linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }   # glibc 2.35: runs on Ubuntu 22.04+, Debian 12+, Fedora 36+
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v5
      - name: Install X11, GTK and VA-API development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxext-dev libxtst-dev libxrandr-dev \
            libxdamage-dev libxfixes-dev libxi-dev libgtk-3-dev libva-dev xvfb
      - name: Build
        run: make -j"$(nproc)" OPT=-O2 all desktop desktop-app desktop-icons desktop-test desktop-vatest
      - name: Unit tests (keymap, pairing line, input, video sizes, colour, encoder, sound)
        run: build/host/desktop/desk_test web/app.js
      - name: Smoke test (starts, finds the screen, stops; a backtrace if it hangs)
        run: |
          sudo apt-get install -y --no-install-recommends gdb >/dev/null
          printf '[desktop]\nnotify = false\n' > smoke.ini
          Xvfb :9 -screen 0 1280x720x24 >/dev/null 2>&1 &
          sleep 1
          DISPLAY=:9 build/host/desktop/remodroid-desktopd -c smoke.ini -v > smoke.log 2>&1 &
          pid=$!
          sleep 6
          cat smoke.log
          grep -q "remodroid-desktop .* on" smoke.log || sudo gdb -q -batch -p $pid -ex "thread apply all bt 20" || true
          kill $pid || true
          grep -q "remodroid-desktop .* on" smoke.log
      - name: End to end (Xvfb + server + agent + Chrome viewer)
        if: matrix.arch == 'x86_64'
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium-headless-shell
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils >/dev/null  # the sound check
          # the gamepad check: the agent creates a virtual Xbox pad (uinput) and the test reads its events
          sudo modprobe uinput
          printf '%s\n' 'KERNEL=="uinput", MODE="0666"' \
            'SUBSYSTEM=="input", ATTRS{name}=="Microsoft X-Box 360 pad", MODE="0666"' | sudo tee /etc/udev/rules.d/99-e2e-pad.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo chmod 666 /dev/uinput
          python3 tests/e2e_desktop.py --bin build/host
      - name: End to end, files and clipboard (the GTK app; a real drag onto its window)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends xdotool dbus python3-gi gir1.2-gtk-3.0 >/dev/null
          python3 tests/e2e_files.py --bin build/host
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            build/host/desktop/libremodroid.so
            build/host/desktop/remodroid-desktop
            build/host/desktop/remodroid-desktopd
            build/host/desktop/icons/
          if-no-files-found: error

  desktop-windows:
    name: desktop (windows ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2022, msystem: UCRT64, cc: gcc, windres: windres }
          - { arch: arm64, runner: windows-11-arm, msystem: CLANGARM64, cc: clang, windres: llvm-windres }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: make
          pacboy: toolchain:p
      - name: Build
        run: |
          make -j4 OPT=-O2 TARGET=win-${{ matrix.arch }} CC=${{ matrix.cc }} HOSTCC=${{ matrix.cc }} \
            WINDRES=${{ matrix.windres }} desktop desktop-app desktop-test
      - name: Unit tests
        run: build/win-${{ matrix.arch }}/desktop/desk_test.exe web/app.js
      - name: Only system DLLs
        run: |
          for f in remodroid.dll RemoDroid.exe remodroid-desktopd.exe remodroid-input.exe; do
            echo "== $f"; objdump -p build/win-${{ matrix.arch }}/desktop/$f | grep "DLL Name"
          done
      - name: Smoke test (starts, finds the screens, stops)
        run: |
          D=build/win-${{ matrix.arch }}/desktop
          printf '[desktop]\nnotify = false\n' > smoke.ini
          $D/remodroid-desktopd.exe -c smoke.ini -v > smoke.log 2>&1 &
          sleep 8; taskkill //F //IM remodroid-desktopd.exe || true; sleep 1
          cat smoke.log
          grep -q "remodroid-desktop .* on Windows" smoke.log
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: |
            build/win-${{ matrix.arch }}/desktop/remodroid.dll
            build/win-${{ matrix.arch }}/desktop/RemoDroid.exe
            build/win-${{ matrix.arch }}/desktop/remodroid-desktopd.exe
            build/win-${{ matrix.arch }}/desktop/remodroid-input.exe
          if-no-files-found: error

  server-windows:
    name: server (windows ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2022, msystem: UCRT64, cc: gcc, windres: windres }
          - { arch: arm64, runner: windows-11-arm, msystem: CLANGARM64, cc: clang, windres: llvm-windres }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: make
          pacboy: toolchain:p
      - name: Build
        run: |
          make -j4 OPT=-Os TARGET=win-${{ matrix.arch }} CC=${{ matrix.cc }} HOSTCC=${{ matrix.cc }} \
            WINDRES=${{ matrix.windres }} LDFLAGS="-Wl,--gc-sections -s"
      - name: Only system DLLs
        run: |
          for f in remodroid-server.exe RemoDroidServer.exe; do
            echo "== $f"; objdump -p build/win-${{ matrix.arch }}/$f | grep "DLL Name"
          done
          # Windows file names ignore case: a tray app named like the server would replace it
          objdump -p build/win-${{ matrix.arch }}/remodroid-server.exe | grep -q "DLL Name: WS2_32.dll"
      - name: Server, supervisor and Windows service
        shell: pwsh
        run: node tests/server_windows.mjs build/win-${{ matrix.arch }}
      - uses: actions/upload-artifact@v5
        with:
          name: server-windows-${{ matrix.arch }}
          path: |
            build/win-${{ matrix.arch }}/remodroid-server.exe
            build/win-${{ matrix.arch }}/RemoDroidServer.exe
          if-no-files-found: error

  desktop-macos:
    name: desktop (macos universal2)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;;
            *) v="0.1.${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build (arm64 + x86_64, macOS 13+)
        run: |
          make -j"$(sysctl -n hw.ncpu)" OPT=-O2 TARGET=mac CC=clang VERSION="$VERSION" \
            ARCHFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=13.0" desktop desktop-app desktop-test
          lipo -info build/mac/desktop/libremodroid.dylib build/mac/desktop/RemoDroid.app/Contents/MacOS/RemoDroid
          codesign --verify --deep --strict build/mac/desktop/RemoDroid.app
      - name: Unit tests
        run: build/mac/desktop/desk_test web/app.js
      - name: Smoke test (starts and stops; capture needs a permission runners don't have)
        run: |
          printf '[desktop]\nnotify = false\n' > smoke.ini
          build/mac/desktop/RemoDroid.app/Contents/MacOS/remodroid-desktopd -c smoke.ini -v > smoke.log 2>&1 &
          pid=$!; sleep 8; kill $pid || true; sleep 1
          cat smoke.log
          grep -q "remodroid-desktop .* on macOS" smoke.log
      - name: Zip the app
        run: ./packaging/desktop/package.sh "$VERSION" macos - build/mac/desktop
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-macos
          path: build/packages/RemoDroid-*-macos.zip
          if-no-files-found: error

  packages:
    name: packages
    needs: [test, binaries, phone, desktop-linux, desktop-windows, server-windows, desktop-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Install nFPM
        run: |
          curl -fsSL -o /tmp/nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nfpm" && tar -C "$RUNNER_TEMP/nfpm" -xzf /tmp/nfpm.tgz
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - name: Install appimagetool and the AppImage runtimes
        run: |
          d="$RUNNER_TEMP/appimage" && mkdir -p "$d"
          curl -fsSL -o "$d/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  $d/appimagetool" | sha256sum -c -
          for a in x86_64 aarch64; do
            curl -fsSL -o "$d/runtime-$a" "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-$a"
          done
          echo "${APPIMAGE_RUNTIME_X86_64_SHA256}  $d/runtime-x86_64" | sha256sum -c -
          echo "${APPIMAGE_RUNTIME_AARCH64_SHA256}  $d/runtime-aarch64" | sha256sum -c -
          chmod +x "$d/appimagetool"
          echo "$d" >> "$GITHUB_PATH"
          echo "APPIMAGE_RUNTIME=$d" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"   # runners have no FUSE
      - name: Version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;;
            *) v="0.1.${GITHUB_RUN_NUMBER}" ;;   # development builds
          esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build Linux and OpenWrt (agent) packages
        run: |
          mkdir -p build/out build/android
          cp -r artifacts/phone/. build/android/
          for a in x86 x86_64 armv7 aarch64 mipsel mips; do
            mkdir -p "build/out/$a" && cp artifacts/bin-$a/* "build/out/$a/"
            ./packaging/package.sh "$VERSION" "$a"
          done
      - name: Build Merlin agent offline packages
        run: |
          for a in armv7 aarch64; do
            ./packaging/merlin/build.sh "$VERSION" "$a"
          done
      - name: Desktop agent packages
        run: |
          for a in x86_64 aarch64; do
            ./packaging/desktop/package.sh "$VERSION" linux "$a" "artifacts/desktop-linux-$a"
          done
          for a in x86_64 arm64; do
            ./packaging/desktop/package.sh "$VERSION" windows "$a" "artifacts/desktop-windows-$a"
          done
          cp artifacts/desktop-macos/RemoDroid-*-macos.zip build/packages/
      - name: Windows server packages
        run: |
          for a in x86_64 arm64; do
            ./packaging/windows/package.sh "$VERSION" "$a" "artifacts/server-windows-$a"
          done
      - name: Package checksums
        run: |
          cd build/packages && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: build/packages/
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Release notes from the tag message
        run: |
          git fetch --force --tags
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: packages
      - name: Download grids (which file for which system and CPU)
        run: |
          printf '\n' >> notes.md
          python3 doc/downloads.py "${GITHUB_REF_NAME#v}" packages >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: RemoDroid ${{ github.ref_name }}
          body_path: notes.md
          files: packages/*
