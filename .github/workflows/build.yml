# Builds RemoDroid for every target and packages it:
#   static binaries  x86, x86_64, armv7, aarch64 (+ mipsel, mips for OpenWrt routers)
#   phone files      remodroid-server.jar + libremodroid.so (arm64-v8a, armeabi-v7a)
#   packages         .deb, .rpm, .apk, .ipk (OpenWrt), .tar.gz, Merlin agent offline installers
# A pushed tag v* publishes a GitHub release; the annotated tag's message is the release notes.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  PEBBLE_VERSION: v2.10.1 # Let's Encrypt's ACME test server, for tests/tls.mjs
  PEBBLE_SHA256: 4f2fcb5bca8c85c9cf73ad140fccfc0d2be40bd81ab99879c79b7b8a0b4f70ed
  CHALLTESTSRV_SHA256: e93a5aa25ecdf3af2f9fbb2de32b0173e64a2eae81002a4ccfe35fa6f4f60b92
  NFPM_VERSION: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750

jobs:
  test:
    name: test (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: make -j"$(nproc)"
      - name: End-to-end control plane tests
        run: node tests/run.mjs build/host
      - name: Install Pebble (ACME test CA)
        run: |
          mkdir -p "$RUNNER_TEMP/pebble"
          for n in pebble:PEBBLE_SHA256 pebble-challtestsrv:CHALLTESTSRV_SHA256; do
            name=${n%%:*}; sum=$(printenv "${n##*:}")
            curl -fsSL -o "/tmp/$name.tgz" "https://github.com/letsencrypt/pebble/releases/download/${PEBBLE_VERSION}/$name-linux-amd64.tar.gz"
            echo "$sum  /tmp/$name.tgz" | sha256sum -c -
            tar -C "$RUNNER_TEMP/pebble" -xzf "/tmp/$name.tgz"
          done
          chmod +x "$RUNNER_TEMP"/pebble/*/linux/amd64/*  # the release tarballs drop the execute bit
          echo "PEBBLE_DIR=$RUNNER_TEMP/pebble" >> "$GITHUB_ENV"
      - name: HTTPS, wss and ACME tests
        run: node tests/tls.mjs build/host
      - name: Setup wizard and router enrollment tests
        run: node tests/setup.mjs build/host
      - name: AI control SDK, rd CLI and skill runner tests
        run: python3 tests/python_sdk.py
      - name: Merlin agent packaging and lifecycle tests
        run: |
          python3 tests/merlin.py
          node --check packaging/merlin/deploy/res/remodroid.js
      - name: Cloudflare Worker tests (wrangler dev)
        run: |
          (cd worker && npm install --no-audit --no-fund)
          node tests/worker.mjs build/host
      - name: Install site uses the panel's stylesheet
        run: cmp web/setup.css wizard/setup.css

  binaries:
    name: binaries (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64, armv7, aarch64, mipsel, mips]
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        run: |
          curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -C "$RUNNER_TEMP/zig" --strip-components=1 -xf /tmp/zig.tar.xz
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build static binaries
        run: ./build/dist.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.arch }}
          path: build/out/${{ matrix.arch }}/
          if-no-files-found: error

  phone:
    name: phone files (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build jar and native libraries
        run: |
          export ANDROID_JAR="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar"
          export D8="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/d8"
          export NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "android.jar: $ANDROID_JAR"; echo "d8: $D8"; echo "NDK: $NDK"
          ./android/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: phone
          path: |
            build/android/remodroid-server.jar
            build/android/arm64-v8a/libremodroid.so
            build/android/armeabi-v7a/libremodroid.so
          if-no-files-found: error

  packages:
    name: packages
    needs: [test, binaries, phone]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Install nFPM
        run: |
          curl -fsSL -o /tmp/nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nfpm" && tar -C "$RUNNER_TEMP/nfpm" -xzf /tmp/nfpm.tgz
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - name: Version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;;
            *) v="0.1.${GITHUB_RUN_NUMBER}" ;;   # development builds
          esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build Linux and OpenWrt packages
        run: |
          mkdir -p build/out build/android
          cp -r artifacts/phone/. build/android/
          for a in x86 x86_64 armv7 aarch64 mipsel mips; do
            mkdir -p "build/out/$a" && cp artifacts/bin-$a/* "build/out/$a/"
            ./packaging/package.sh "$VERSION" "$a"
          done
      - name: Build Merlin agent offline packages
        run: |
          for a in armv7 aarch64; do
            ./packaging/merlin/build.sh "$VERSION" "$a"
          done
      - name: Package checksums
        run: |
          cd build/packages && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: build/packages/
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Release notes from the tag message
        run: |
          git fetch --force --tags
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: packages
      - name: Download grids (which file for which system and CPU)
        run: |
          printf '\n' >> notes.md
          python3 doc/downloads.py "${GITHUB_REF_NAME#v}" packages >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: RemoDroid ${{ github.ref_name }}
          body_path: notes.md
          files: packages/*
