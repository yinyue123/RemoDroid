<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Instalar RemoDroid</title>
<meta name="description" content="Controla un móvil Android o un ordenador Windows, Mac o Linux desde tu iPhone: prepara un panel (en Cloudflare, un servidor Linux o un servidor Windows) y después RemoDroid en lo que quieras controlar.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/setup.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./"><i>RD</i>RemoDroid</a>
  <span class="spacer"></span>
  <select class="link" aria-label="Idioma" onchange="location.href=this.value" style="appearance:none;-webkit-appearance:none;background:none;cursor:pointer"><option value="/">English</option><option value="/zh/">简体中文</option><option value="/ja/">日本語</option><option value="/ko/">한국어</option><option value="/es/" selected>Español</option><option value="/pt-BR/">Português (Brasil)</option><option value="/de/">Deutsch</option><option value="/fr/">Français</option><option value="/ru/">Русский</option></select>
  <a class="link" href="https://github.com/yinyue123/RemoDroid/blob/main/doc/es/README.md" target="_blank" rel="noopener">Documentación ↗</a>
</header>
<nav class="steps" id="steps" aria-label="Pasos de instalación"></nav>
<main id="main" aria-live="polite"></main>
<footer class="foot">
  <button class="back" id="back" type="button">← Atrás</button>
  <span class="left" id="left"></span>
  <button class="btn" id="next" type="button">Siguiente →</button>
</footer>
<script>
(() => {
'use strict';
const SITE = location.origin.startsWith('http') && !/^(localhost|127\.)/.test(location.hostname) ? location.origin : 'https://remodroid.pages.dev';
const REPO = 'yinyue123/RemoDroid';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const main = $('#main');
const COPY = '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
const hl = s => esc(s).replace(/(\s)(--?[a-zA-Z-]+)/g, '$1<span class="f">$2</span>').replace(/(\|)/g, '<span class="f">$1</span>');
const cmd = t => `<div class="cmd"><code>${hl(t)}</code><button type="button" aria-label="Copiar" data-copy="${esc(t)}">${COPY}</button></div>`;
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); } catch (_) {
    const ta = document.createElement('textarea'); ta.value = b.dataset.copy; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (__) {} ta.remove();
  }
  b.classList.add('ok'); b.innerHTML = '✓'; setTimeout(() => { b.classList.remove('ok'); b.innerHTML = COPY; }, 1400);
});

/* remembered between visits: what you control, where the panel is, which OS */
let S = { target: 'phone', server: 'cf', os: 'openwrt', dos: '' };
try { Object.assign(S, JSON.parse(localStorage.getItem('rd-install') || '{}')); } catch (_) {}
const save = () => { try { localStorage.setItem('rd-install', JSON.stringify(S)); } catch (_) {} };

if (!['cf', 'self', 'win'].includes(S.server)) S.server = 'cf';
if (!S.dos) S.dos = /Mac/.test(navigator.platform) ? 'macos' : /Linux/.test(navigator.platform) && !/Android/.test(navigator.userAgent) ? 'linux' : 'windows';
const PANEL_ON = { cf: 'Cloudflare', self: 'un servidor Linux', win: 'un servidor Windows' };
/* the steps follow from the two answers on the first page */
const stepsFor = () => [
  { label: 'Inicio', sub: 'Elegir', page: pageStart },
  { label: 'Panel', sub: 'Instalar', page: pageServer },
  { label: 'Panel', sub: 'Abrir', page: pagePanel },
  ...(S.target === 'phone'
    ? [{ label: 'Router', sub: 'Instalar', page: pageAgent }, { label: 'Conectar', sub: 'Registrar', page: pageConnect }, { label: 'Móvil', sub: 'USB', page: pagePhone }]
    : [{ label: 'Ordenador', sub: 'Instalar', page: pageComputer }, { label: 'Conectar', sub: 'Emparejar', page: pagePair }]),
  { label: 'Listo', sub: 'Úsalo', page: pageDone },
];
let STEPS = stepsFor();
/* "remodroid.example.com" / "http://1.2.3.4:5580/" → "https://remodroid.example.com" / "http://1.2.3.4:5580" */
function panelUrl(v) {
  v = String(v || '').trim().replace(/\/+$/, '').replace(/\/(wizard|agent)\.html.*$/, '');
  if (!v) return '';
  if (!/^https?:\/\//.test(v)) v = (/^[\d.]+(:\d+)?$/.test(v) ? 'http://' : 'https://') + v;
  return v;
}
const panelField = id => `<div class="form" style="margin-top:6px"><div class="field"><label for="${id}">La dirección de tu panel</label>
  <input id="${id}" type="text" inputmode="url" spellcheck="false" autocomplete="url" placeholder="https://remodroid.example.com  o  http://203.0.113.10:5580" value="${esc(S.panel || '')}">
  <div class="hint">Se recuerda aquí para los siguientes pasos.</div></div></div>`;
function bindPanel(id, after) {
  const el = document.getElementById(id);
  el.addEventListener('change', () => { S.panel = panelUrl(el.value); el.value = S.panel; save(); if (after) after(); });
}
let step = Math.min(+(location.hash.match(/^#step(\d)$/) || [0, 1])[1] - 1, STEPS.length - 1);
if (!(step >= 0)) step = 0;

function renderSteps() {
  $('#steps').innerHTML = STEPS.map((s, i) => `${i ? `<span class="bar${i <= step ? ' done' : ''}"></span>` : ''}<button class="st${i === step ? ' on' : i < step ? ' done' : ''}" type="button" data-i="${i}"><span class="n">${i < step ? '✓' : i + 1}</span><span><b>${s.label}</b><small>${s.sub}</small></span></button>`).join('');
  $('#steps').querySelectorAll('[data-i]').forEach(b => b.onclick = () => go(+b.dataset.i));
  $('#back').disabled = step === 0;
  const left = STEPS.length - 1 - step;
  $('#left').textContent = left ? `${left} paso${left > 1 ? 's' : ''} más` : 'todo listo';
  $('#next').hidden = step === STEPS.length - 1;
}
function go(i) { STEPS = stepsFor(); step = i; history.replaceState(null, '', '#step' + (i + 1)); renderSteps(); STEPS[i].page(); window.scrollTo(0, 0); }
$('#back').onclick = () => go(Math.max(0, step - 1));
$('#next').onclick = () => go(Math.min(STEPS.length - 1, step + 1));
const eyebrow = (n, t) => `<p class="eyebrow">${String(n).padStart(2, '0')} — ${t}</p>`;

/* ---------- release assets (for "download the package") ---------- */
let assets = null;
async function loadAssets() {
  if (assets) return assets;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
    const j = await r.json();
    assets = { tag: j.tag_name, list: (j.assets || []).map(a => ({ name: a.name, url: a.browser_download_url, size: a.size })) };
  } catch (_) { assets = { tag: '', list: [] }; }
  return assets;
}
const MB = n => (n / 1048576).toFixed(1) + ' MB';
async function fillFiles(el, res) {
  const a = await loadAssets();
  const hits = a.list.filter(x => res.some(re => re.test(x.name)));
  el.innerHTML = hits.length ? hits.map(x => `<a class="btn" style="margin:0 10px 10px 0" href="${esc(x.url)}"><span>Descargar</span><small style="font:12px var(--mono);opacity:.7">${esc(x.name)} · ${MB(x.size)}</small></a>`).join('')
    : `<p class="note">No hay nada para esto en ${esc(a.tag || 'la última versión')}. Mira <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">todos los archivos</a>.</p>`;
}
async function fillDownloads(el, who, os, cpu) {
  const a = await loadAssets();
  const re = {
    openwrt: new RegExp(`^remodroid-${who}_.*_(${cpu === 'x86_64' ? 'x86_64' : cpu === 'aarch64' ? 'aarch64_[a-z0-9-]+' : cpu === 'armv7' ? 'arm_[a-z0-9_-]+' : cpu === 'mipsel' ? 'mipsel_24kc' : cpu === 'mips' ? 'mips_24kc' : 'i386_pentium4'})\\.ipk$`),
    debian: new RegExp(`^remodroid-${who}_.*_${{ x86_64: 'amd64', aarch64: 'arm64', armv7: 'armhf', x86: 'i386' }[cpu] || 'none'}\\.deb$`),
    rhel: new RegExp(`^remodroid-${who}-.*\\.${{ x86_64: 'x86_64', aarch64: 'aarch64', armv7: 'armv7hl', x86: 'i686' }[cpu] || 'none'}\\.rpm$`),
    alpine: new RegExp(`^remodroid-${who}_.*_${{ x86_64: 'x86_64', aarch64: 'aarch64', armv7: 'armv7', x86: 'x86' }[cpu] || 'none'}\\.apk$`),
  }[os];
  const hits = a.list.filter(x => re.test(x.name));
  el.innerHTML = hits.length ? hits.map(x => `<a class="btn" style="margin:0 10px 10px 0" href="${esc(x.url)}"><span>Descargar</span><small style="font:12px var(--mono);opacity:.7">${esc(x.name)} · ${MB(x.size)}</small></a>`).join('')
    : `<p class="note">No hay paquete para esta combinación en ${esc(a.tag || 'la última versión')}. Mira <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">todos los archivos</a> (el <code>.tar.gz</code> funciona en cualquier Linux).</p>`;
}

const OS = {
  openwrt: { name: 'OpenWrt', agent: `wget -qO- ${SITE}/install_agent.sh | sh`, install: 'opkg install ./remodroid-agent_*.ipk', cpus: ['mipsel', 'mips', 'armv7', 'aarch64', 'x86_64'] },
  debian: { name: 'Debian · Ubuntu', agent: `curl -fsSL ${SITE}/install_agent.sh | sudo sh`, install: 'sudo apt install ./remodroid-*.deb', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
  rhel: { name: 'CentOS · Fedora', agent: `curl -fsSL ${SITE}/install_agent.sh | sudo sh`, install: 'sudo dnf install ./remodroid-*.rpm', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
  alpine: { name: 'Alpine', agent: `wget -qO- ${SITE}/install_agent.sh | sh`, install: 'apk add --allow-untrusted ./remodroid-*.apk', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
};
/* starting what a package installed */
const SERVER_START = {
  debian: 'sudo systemctl enable --now remodroid-server',
  rhel: 'sudo systemctl enable --now remodroid-server',
  alpine: 'rc-update add remodroid-server && rc-service remodroid-server start',
};
const AGENT_START = {
  openwrt: '/etc/init.d/remodroid-agent enable && /etc/init.d/remodroid-agent start',
  debian: 'sudo systemctl enable --now remodroid-agent',
  rhel: 'sudo systemctl enable --now remodroid-agent',
  alpine: 'rc-update add remodroid-agent && rc-service remodroid-agent start',
};
const CPU = { mipsel: 'MIPS (LE)', mips: 'MIPS (BE)', armv7: 'ARMv7', aarch64: 'ARM64', x86_64: 'x86_64', x86: 'x86' };

/* ---------- 1. start: what you control, where the panel goes ---------- */
function pageStart() {
  const t = S.target, sv = S.server;
  main.innerHTML = `${eyebrow(1, 'inicio')}<h1>Dos <em>preguntas</em></h1>
    <p class="lede">RemoDroid son dos piezas: un <b>panel</b>, la página web en la que inicias sesión, y <b>RemoDroid en lo que controlas</b>. Luego lo usas desde Safari en tu iPhone, o cualquier navegador, sin instalar nada allí.</p>
    <div class="num"><i>1</i>¿Qué quieres controlar?</div>
    <div class="choices">
      <button class="choice" type="button" data-t="phone" aria-pressed="${t === 'phone'}"><small>RemoDroid para móviles</small><b>Un móvil Android</b><span>Conectado por USB a tu router (OpenWrt, ASUS Merlin o cualquier equipo Linux). No se instala nada en el móvil.</span></button>
      <button class="choice" type="button" data-t="computer" aria-pressed="${t === 'computer'}"><small>RemoDroid para ordenadores</small><b>Un ordenador</b><span>Windows 10 u 11, un Mac (macOS 13+) o un PC con Linux. Una pequeña app en el propio ordenador.</span></button>
    </div>
    <div class="num"><i>2</i>¿Dónde funcionará el panel?</div>
    <div class="choices">
      <button class="choice" type="button" data-s="cf" aria-pressed="${sv === 'cf'}"><small>Sin servidor</small><b>Cloudflare</b><span>Gratis: Cloudflare aloja la página y retransmite el vídeo cuando una red bloquea la conexión directa. Unos minutos en el navegador.</span></button>
      <button class="choice" type="button" data-s="self" aria-pressed="${sv === 'self'}"><small>Autoalojado</small><b>Un servidor Linux</b><span>Un VPS con IP pública, idealmente cerca de casa. Un comando; su propio relé TURN.</span></button>
      <button class="choice" type="button" data-s="win" aria-pressed="${sv === 'win'}"><small>Autoalojado</small><b>Un servidor Windows</b><span>Windows Server 2019+, o Windows 10/11 con IP pública. Descomprime y pulsa Install.</span></button>
    </div>
    <p class="note">Tu plan: el panel en <b>${PANEL_ON[sv]}</b>, luego <b>${t === 'phone' ? 'RemoDroid para móviles en tu router' : 'RemoDroid para ordenadores en tu ordenador'}</b>, y después ábrelo en tu iPhone. Un panel sirve para cualquier número de móviles y ordenadores: vuelve aquí para añadir el otro tipo.</p>`;
  main.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.target = b.dataset.t; save(); go(0); });
  main.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.server = b.dataset.s; save(); go(0); });
}

/* ---------- 2. the panel: install it where you chose ---------- */
const change = () => `<p class="note">Panel en <b>${PANEL_ON[S.server]}</b>. <a href="#step1" data-go="0">Cambiar</a></p>`;
function pageServer() {
  const self = S.server === 'self';
  main.innerHTML = `${eyebrow(2, 'panel')}<h1>Instala el <em>panel</em></h1>
    <p class="lede">El panel es donde se encuentran tus ${S.target === 'phone' ? 'routers' : 'ordenadores'} y tu iPhone: una página web con tu inicio de sesión.</p>
    ${change()}<div id="detail"></div>`;
  main.querySelector('[data-go]').onclick = e => { e.preventDefault(); go(0); };
  const d = $('#detail');
  if (S.server === 'win') {
    d.innerHTML = `<div class="num"><i>1</i>Descárgalo</div>
      <div class="seg" id="wcpu">${['x86_64', 'aarch64'].map(k => `<button type="button" data-cpu="${k}" aria-selected="${(S.wcpu || 'x86_64') === k}">${CPU[k]}</button>`).join('')}</div>
      <div id="wdl"><p class="note">Buscando la última versión…</p></div>
      <div class="num"><i>2</i>Instala e inicia</div>
      <p>Descomprímelo en una carpeta donde pueda quedarse, ejecuta <b>RemoDroidServer.exe</b> y elige <b>Install and start</b>. Ejecuta el panel como servicio de Windows, que arranca con Windows haya o no sesión iniciada, y lo deja pasar por el Firewall de Windows. Su icono queda junto al reloj.</p>
      <p class="note">Desde un símbolo del sistema (como administrador): <code>remodroid-server install</code></p>
      <div class="chips"><small>Abre en el firewall de tu nube</small><span class="chip">TCP 80 · 443 (dominio)</span><span class="chip">UDP 3478</span><span class="chip">UDP 49152–49252</span></div>`;
    d.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.wcpu = b.dataset.cpu; save(); pageServer(); });
    fillFiles($('#wdl'), [new RegExp(`^RemoDroid-Server-.*-windows-${(S.wcpu || 'x86_64') === 'aarch64' ? 'arm64' : 'x86_64'}\\.zip$`)]);
  } else if (self) {
    const one = `curl -fsSL ${SITE}/install_server.sh | sudo sh`;
    d.innerHTML = `<div class="num"><i>1</i>Una línea — en cualquier Linux</div>
      <p class="bullet">Descarga, instala e inicia el servidor, todo en uno.</p>
      ${cmd(one)}
      <div class="term"><div><span class="p">$</span> ${esc(one)}</div><div class="d">▸ descargando remodroid-server_…_amd64.deb</div><div class="d">▸ iniciando el servicio</div><div class="k">✓ el servidor está en marcha. Abre el asistente:</div><div>    http://203.0.113.10:5580/wizard.html?token=d93kss5mrwsc</div></div>
      <p class="note">Guarda el enlace que muestra: el siguiente paso lo abre.</p>
      <div class="num"><i class="alt">2</i>O instala un paquete</div>
      <div class="seg" id="sos">${['debian', 'rhel', 'alpine'].map(k => `<button type="button" data-os="${k}" aria-selected="${(S.sos || 'debian') === k}">${OS[k].name}</button>`).join('')}</div>
      <div class="seg" id="scpu">${['x86_64', 'aarch64'].map(k => `<button type="button" data-cpu="${k}" aria-selected="${(S.scpu || 'x86_64') === k}">${CPU[k]}</button>`).join('')}</div>
      <div id="sdl"><p class="note">Buscando la última versión…</p></div>
      ${cmd(OS[S.sos || 'debian'].install.replace('remodroid-', 'remodroid-server').replace('-*', '*'))}
      <div class="num"><i class="alt">3</i>Inícialo</div>
      <p class="bullet">Un paquete solo instala el servidor. Inícialo y haz que vuelva a arrancar tras reiniciar:</p>
      ${cmd(SERVER_START[S.sos || 'debian'])}
      <p>Después abre <code>http://&lt;ip-del-servidor&gt;:5580/wizard.html</code>. El código de configuración está en <code>/var/lib/remodroid/setup-token</code>; el puerto es <code>listen</code> en <code>/etc/remodroid/server.ini</code>.</p>`;
    d.querySelectorAll('[data-os]').forEach(b => b.onclick = () => { S.sos = b.dataset.os; save(); pageServer(); });
    d.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.scpu = b.dataset.cpu; save(); pageServer(); });
    fillDownloads($('#sdl'), 'server', S.sos || 'debian', S.scpu || 'x86_64');
  } else {
    const deploy = `git clone https://github.com/${REPO} && cd RemoDroid/worker\nnpm install && npx wrangler deploy`;
    d.innerHTML = `<div class="num"><i>1</i>Crea una clave TURN</div>
      <p>Cloudflare retransmite el vídeo cuando una red bloquea las conexiones directas (1.000 GB al mes gratis). En el <a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">panel de Cloudflare</a>: <b>Realtime</b> → <b>TURN Server</b> → <b>Create</b>. Guarda el <b>Turn Token ID</b> y el <b>API Token</b> para el siguiente paso.</p>
      <div class="num"><i>2</i>Despliega el Worker</div>
      <p class="bullet">Desde un ordenador con Node.js: te pedirá iniciar sesión en Cloudflare una vez.</p>
      ${cmd(deploy)}
      <div class="term"><div><span class="p">$</span> npx wrangler deploy</div><div class="d">▸ Subido remodroid (archivos web, Durable Object "Hub")</div><div class="k">✓ Desplegado: https://remodroid.&lt;tú&gt;.workers.dev</div></div>
      <p class="note">O sin terminal: haz un fork de <a href="https://github.com/${REPO}" target="_blank" rel="noopener">${REPO}</a> y en el panel de Cloudflare <b>Workers &amp; Pages</b> → <b>Create</b> → <b>Import a repository</b> → elige tu fork → <b>Root directory: worker</b> → Deploy. A partir de ahí, cada push a tu fork actualiza el panel solo. El almacenamiento (la base de datos del Durable Object) se crea solo.</p>`;
  }
}

/* ---------- 3. panel: run it, open it, finish its setup ---------- */
function pagePanel() {
  const self = S.server === 'self';
  if (S.server === 'win') {
    main.innerHTML = `${eyebrow(3, 'panel')}<h1>Abre tu <em>panel</em></h1>
      <p class="lede">La ventana de RemoDroid Server en la máquina Windows configura el panel; después es una página web en la que inicias sesión desde cualquier sitio.</p>
      <div class="num"><i>1</i>Configúralo en la ventana</div>
      <p>En <b>RemoDroidServer.exe</b>: el inicio de sesión del <b>administrador</b>, el <b>puerto web</b>, un <b>dominio</b> para HTTPS gratis de Let's Encrypt (opcional) y <b>STUN/TURN</b>. La misma ventana inicia y detiene el panel y muestra su registro.</p>
      <div class="num"><i>2</i>Ábrelo</div>
      <p>Desde cualquier sitio: <code>https://&lt;tu dominio&gt;</code>, o <code>http://&lt;ip-del-servidor&gt;:&lt;puerto web&gt;</code> sin dominio.</p>
      <div class="num"><i class="alt">3</i>¿Dónde está ahora?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  } else if (self) {
    main.innerHTML = `${eyebrow(3, 'panel')}<h1>Abre tu <em>panel</em></h1>
      <p class="lede">El servidor es el panel: una página web en tu servidor donde inicias sesión y añades lo que controlas.</p>
      <div class="num"><i>1</i>Ejecuta el servidor</div>
      <p class="bullet">El instalador de una línea ya lo inició. ¿Instalaste un paquete tú mismo? Inícialo ahora:</p>
      ${cmd('sudo systemctl enable --now remodroid-server')}
      <p class="note">Alpine: <code>rc-update add remodroid-server &amp;&amp; rc-service remodroid-server start</code> · compruébalo: <code>systemctl status remodroid-server</code> (Alpine: <code>rc-service remodroid-server status</code>)</p>
      <div class="num"><i>2</i>Abre su página web</div>
      <p>Abre el enlace que mostró el instalador: <code>http://&lt;ip-del-servidor&gt;:5580/wizard.html?token=…</code>. El <b>token</b> demuestra que el servidor es tuyo. ¿Perdiste el enlace? Lee el token en el servidor:</p>
      ${cmd('sudo cat /var/lib/remodroid/setup-token')}
      <div class="chips"><small>Abre antes</small><span class="chip">TCP 5580</span><span class="chip">TCP 80 · 443 (dominio)</span><span class="chip">UDP 3478</span><span class="chip">UDP 49152–49252</span></div>
      <div class="num"><i>3</i>Completa el asistente</div>
      <p>Pide <b>un dominio</b> (HTTPS gratis de Let's Encrypt, que se renueva solo), <b>tu inicio de sesión</b> y el <b>puerto STUN/TURN</b>, escribe <code>/etc/remodroid/server.ini</code> y reinicia el servidor en tu dirección. Más tarde la misma página, tras tu contraseña, edita los ajustes.</p>
      <div class="num"><i class="alt">4</i>¿Dónde está ahora?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  } else {
    main.innerHTML = `${eyebrow(3, 'panel')}<h1>Abre tu <em>panel</em></h1>
      <p class="lede">Tu Worker es el panel: una página web donde inicias sesión y añades lo que controlas.</p>
      <div class="num"><i>1</i>Abre tu Worker</div>
      <p>Su dirección la muestra <code>wrangler deploy</code>, y en el panel de Cloudflare: <b>Workers &amp; Pages</b> → <b>remodroid</b> → <b>Visit</b>. Normalmente <code>https://remodroid.&lt;tú&gt;.workers.dev</code>.</p>
      <div class="num"><i>2</i>Completa el asistente</div>
      <p>Pide <b>tu inicio de sesión</b> y la <b>clave TURN</b> del paso anterior (u otros servidores STUN/TURN). ¿Quieres tu propia dirección? Worker → <b>Settings</b> → <b>Domains &amp; Routes</b> → añade un dominio personalizado.</p>
      <div class="callout">Hazlo justo después de desplegar: hasta entonces, el primer visitante elige el inicio de sesión. Para ir sobre seguro, da antes al Worker un secret <code>SETUP_TOKEN</code> (Settings → Variables and Secrets → Add, tipo <b>Secret</b>; una variable normal se pierde en el siguiente despliegue); la página de configuración te lo pedirá.</div>
      <div class="num"><i class="alt">3</i>¿Dónde está?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  }
  const open = () => { $('#open').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/" target="_blank" rel="noopener">Abrir ${esc(S.panel.replace(/^https?:\/\//, ''))} ↗</a>` : ''; };
  bindPanel('panel', open);
  open();
}

/* ---------- 4. RemoDroid for phones, on the router ---------- */
function pageAgent() {
  const o = OS[S.os];
  const cpu = o.cpus.includes(S.cpu) ? S.cpu : o.cpus[0];
  main.innerHTML = `${eyebrow(4, 'router')}<h1>RemoDroid para <em>móviles</em></h1>
    <p class="lede">Funciona en el router al que está conectado el móvil (o en cualquier equipo Linux con puerto USB) y se conecta él solo a tu panel. Sin puertos abiertos ni dirección pública; no se instala nada en el propio móvil.</p>
    <div class="seg">${Object.entries(OS).map(([k, v]) => `<button type="button" data-os="${k}" aria-selected="${k === S.os}">${v.name}</button>`).join('')}</div>
    <div class="num"><i>1</i>Un comando</div>
    <p class="bullet">Descarga, instala e inicia, todo en uno. Ejecútalo en el router (SSH).</p>
    ${cmd(o.agent)}
    <div class="term"><div><span class="p">$</span> ${esc(o.agent)}</div><div class="d">▸ descargando remodroid-agent_…_${S.os === 'openwrt' ? 'mipsel_24kc.ipk' : 'amd64.deb'}</div><div class="d">▸ iniciando el servicio</div><div class="k">✓ en marcha</div></div>
    <div class="num"><i class="alt">2</i>O descarga el paquete</div>
    <div class="seg">${o.cpus.map(k => `<button type="button" data-cpu="${k}" aria-selected="${k === cpu}">${CPU[k]}</button>`).join('')}</div>
    <div id="adl"><p class="note">Buscando la última versión…</p></div>
    ${cmd(o.install.replace('remodroid-*', 'remodroid-agent*').replace('remodroid-agent_*', 'remodroid-agent_*'))}
    <div class="num"><i class="alt">3</i>Inícialo</div>
    <p class="bullet">Un paquete solo lo instala. Inícialo y haz que vuelva a arrancar tras reiniciar:</p>
    ${cmd(AGENT_START[S.os])}
    <p class="note">Después conéctalo a tu panel: el siguiente paso.</p>
    <div class="chips"><small>Necesita</small><span class="chip">un puerto USB</span><span class="chip">${S.os === 'openwrt' ? 'ca-bundle (se instala con él)' : 'ca-certificates'}</span><span class="chip">la hora correcta (HTTPS)</span></div>
    <p class="note">ASUS Merlin con Koolshare: toma el <code>remodroid-…-merlin-….tar.gz</code> de <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">la última versión</a> e instálalo en Software Center → Manual installation.</p>`;
  main.querySelectorAll('[data-os]').forEach(b => b.onclick = () => { S.os = b.dataset.os; save(); pageAgent(); });
  main.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.cpu = b.dataset.cpu; save(); pageAgent(); });
  fillDownloads($('#adl'), 'agent', S.os, cpu);
}

/* ---------- 5. connect: the code comes from your panel ---------- */
function pageConnect() {
  main.innerHTML = `${eyebrow(5, 'conectar')}<h1>Registra <em>el router</em></h1>
    <p class="lede">El router se une a tu panel con un código de un solo uso que solo tu panel puede crear.</p>
    ${S.panel ? '' : panelField('panel')}
    <div class="num"><i>1</i>Abre la pestaña Agentes de tu panel</div>
    <p id="routers"></p>
    <div class="num"><i>2</i>Añade un agente</div>
    <p>Ese enlace abre <b>Añadir un agente → Conectar</b> (o haz clic tú mismo). Tu panel muestra un código como <code>X5SX-K3M7</code>: de un solo uso, válido <b>10 minutos</b>. Allí la página tiene el comando completo con un botón para copiarlo; o escribe aquí el código.</p>
    <div class="form"><div class="field"><label for="code">Código de tu panel</label><input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="9" style="font-family:var(--mono);letter-spacing:.08em"></div></div>
    <div class="num"><i>3</i>Ejecútalo en el router</div>
    <div id="enroll"></div>
    <div class="term" id="term"></div>
    <p class="note">Cuando diga <b>bound</b>, la página de tu panel también se pondrá en verde. Desde entonces los ajustes de vídeo, móvil y portapapeles del router están en la pestaña Agentes del panel, sin editar ini.</p>`;
  const draw = () => {
    const code = ($('#code').value || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
    const c = code.length === 8 ? code.slice(0, 4) + '-' + code.slice(4) : '';
    const p = S.panel || 'https://your.panel';
    const line = `remodroid enroll --panel ${p} --code ${c || 'XXXX-XXXX'}`;
    $('#routers').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/agent.html#connect" target="_blank" rel="noopener">Abrir ${esc(S.panel.replace(/^https?:\/\//, ''))}/agent.html ↗</a>`
      : 'Escribe arriba la dirección de tu panel, o ábrelo tú mismo y ve a <b>Agentes → Añadir</b>.';
    $('#enroll').innerHTML = c && S.panel ? cmd(line) : `<div class="cmd"><code style="color:var(--faint)">${esc(line)}</code></div><p class="note">${S.panel ? 'Escribe arriba el código de tu panel.' : 'Escribe la dirección de tu panel y el código.'}</p>`;
    $('#term').innerHTML = `<div><span class="p">$</span> ${esc(line)}</div><div class="d">▸ contactando con el panel ${esc(p)}…</div><div class="d">▸ registrado como "OpenWrt" (openwrt); guardado en /etc/remodroid/agent.ini</div><div class="k">✓ bound — este router está en línea</div>`;
  };
  $('#code').addEventListener('input', draw);
  if (!S.panel) bindPanel('panel', () => pageConnect());
  draw();
}

/* ---------- 6. phone ---------- */
function pagePhone() {
  main.innerHTML = `${eyebrow(6, 'móvil')}<h1>Conecta <em>el móvil</em></h1>
    <p class="lede">Una vez por móvil. Android 8 o posterior; un codificador H.265 por hardware ayuda, pero no es necesario.</p>
    <div class="num"><i>1</i>Activa la depuración USB</div>
    <p>Ajustes → Información del teléfono → toca <b>Número de compilación</b> siete veces. Luego Ajustes → Sistema → <b>Opciones para desarrolladores</b> → <b>Depuración USB</b>.</p>
    <div class="num"><i>2</i>Conéctalo al puerto USB del router</div>
    <p>Un cable de datos, no uno solo de carga. RemoDroid en el router encuentra el móvil solo y arranca en él un pequeño ayudante (nada de Play Store).</p>
    <div class="num"><i>3</i>Permite el router</div>
    <p>El móvil pregunta <b>“¿Permitir depuración USB?”</b>. Marca <b>Permitir siempre desde este ordenador</b> y luego <b>Permitir</b>. ${S.panel ? `<a href="${esc(S.panel)}/agent.html" target="_blank" rel="noopener">La pestaña Agentes del panel</a>` : 'La pestaña Agentes del panel'} muestra el móvil como listo.</p>`;
}

/* ---------- 4. RemoDroid for computers ---------- */
const DESK = {
  windows: { name: 'Windows', cpus: ['x86_64', 'aarch64'],
    files: cpu => [new RegExp(`^RemoDroid-(Computer-)?[0-9][^-]*-windows-${cpu === 'aarch64' ? 'arm64' : 'x86_64'}\\.zip$`)],
    steps: 'Descomprímelo donde quieras (deja los archivos juntos) y ejecuta <b>RemoDroid.exe</b>. Su icono aparece junto al reloj. Windows 10 1809 o posterior. Para controlar también programas que se ejecutan como administrador, elige una vez <b>Control administrator windows…</b> en su menú.' },
  macos: { name: 'macOS', cpus: [],
    files: () => [/^RemoDroid-(Computer-)?[0-9][^-]*-macos\.zip$/],
    steps: 'Descomprímelo, mueve <b>RemoDroid.app</b> a Aplicaciones y ábrelo (la primera vez: clic derecho → <b>Abrir</b>). Vive en la barra de menús. Permite <b>Grabación de pantalla</b> y <b>Accesibilidad</b> cuando lo pida y luego <b>Salir y volver a abrir</b>. macOS 13 o posterior, Apple silicon o Intel.' },
  linux: { name: 'Linux', cpus: ['x86_64', 'aarch64'],
    files: cpu => [new RegExp(`^remodroid-desktop_.*_${cpu === 'aarch64' ? 'arm64' : 'amd64'}\\.deb$`), new RegExp(`^remodroid-desktop-.*\\.${cpu}\\.rpm$`),
      new RegExp(`^RemoDroid-(Computer-)?[0-9][^-]*-linux-${cpu}\\.AppImage$`)],
    steps: 'Instala el <code>.deb</code> o el <code>.rpm</code> y abre <b>RemoDroid</b> desde el menú de aplicaciones; en otras distribuciones haz ejecutable el <code>.AppImage</code> y ejecútalo. Necesita una sesión X11 (en GNOME: “GNOME on Xorg” al iniciar sesión).' },
};
function pageComputer() {
  const o = DESK[S.dos] || DESK.windows;
  const cpu = o.cpus.includes(S.dcpu) ? S.dcpu : o.cpus[0];
  main.innerHTML = `${eyebrow(4, 'ordenador')}<h1>RemoDroid para <em>ordenadores</em></h1>
    <p class="lede">Una pequeña app en el ordenador que quieres controlar. Se conecta ella sola a tu panel: sin puertos abiertos ni dirección pública.</p>
    <div class="seg">${Object.entries(DESK).map(([k, v]) => `<button type="button" data-dos="${k}" aria-selected="${k === S.dos}">${v.name}</button>`).join('')}</div>
    ${o.cpus.length ? `<div class="seg">${o.cpus.map(k => `<button type="button" data-dcpu="${k}" aria-selected="${k === cpu}">${CPU[k]}</button>`).join('')}</div>` : ''}
    <div class="num"><i>1</i>Descárgala</div>
    <div id="ddl"><p class="note">Buscando la última versión…</p></div>
    <div class="num"><i>2</i>Instálala e iníciala</div>
    <p>${o.steps}</p>
    <p class="note">Después conéctala a tu panel: el siguiente paso.</p>`;
  main.querySelectorAll('[data-dos]').forEach(b => b.onclick = () => { S.dos = b.dataset.dos; save(); pageComputer(); });
  main.querySelectorAll('[data-dcpu]').forEach(b => b.onclick = () => { S.dcpu = b.dataset.dcpu; save(); pageComputer(); });
  fillFiles($('#ddl'), o.files(cpu));
}

/* ---------- 5. pair the computer with the panel ---------- */
function pagePair() {
  main.innerHTML = `${eyebrow(5, 'conectar')}<h1>Empareja <em>el ordenador</em></h1>
    <p class="lede">El ordenador se une a tu panel con una línea de un solo uso que solo tu panel puede crear.</p>
    ${S.panel ? '' : panelField('panel')}
    <div class="num"><i>1</i>Crea la línea en tu panel</div>
    <p id="padd"></p>
    <p>En el panel: <b>Agentes</b> → <b>Añadir</b> → <b>Ordenador</b>. Muestra una línea con un código de un solo uso, válida <b>10 minutos</b>, y un botón para copiarla.</p>
    <div class="num"><i>2</i>Pégala en el ordenador</div>
    <p>Haz clic en el icono de RemoDroid (junto al reloj, o en la barra de menús del Mac) → <b>Pair with a panel…</b>, pega la línea entera y pulsa <b>Pair</b>. Cuando diga <b>Paired</b>, el panel muestra el ordenador en línea.</p>
    <p class="note">¿Sin pantalla o sin bandeja? Ejecuta la línea en un terminal: <code>remodroid-desktopd pair --panel … --code …</code>, y después <code>remodroid-desktopd</code>.</p>`;
  const link = () => { $('#padd').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/panel.html#agents/add" target="_blank" rel="noopener">Abrir ${esc(S.panel.replace(/^https?:\/\//, ''))} → Añadir ↗</a>` : ''; };
  if (!S.panel) bindPanel('panel', () => pagePair());
  link();
}

/* ---------- done ---------- */
function pageDone() {
  const phone = S.target === 'phone';
  main.innerHTML = `${eyebrow(STEPS.length, 'listo')}<h1>A <em>${phone ? 'jugar' : 'conectarse'}</em></h1>
    <p class="lede">Abre tu panel en Safari en el iPhone, inicia sesión y luego <b>Compartir</b> → <b>Añadir a pantalla de inicio</b> para pantalla completa. Toca tu ${phone ? 'móvil' : 'ordenador'} para conectarte.</p>
    ${phone ? `<dl class="kv"><dt>Tacto</dt><dd>El multitáctil va directo al móvil; la bola flotante abre el menú.</dd>
      <dt>Calidad</dt><dd>Menú → Ajustes: resolución, fotogramas, bitrate, H.265 o H.264.</dd>
      <dt>Fotos</dt><dd>Menú → Foto: del iPhone a la Galería del móvil.</dd>
      <dt>Portapapeles</dt><dd>Texto en ambos sentidos; un toque con HTTPS.</dd></dl>`
    : `<dl class="kv"><dt>Ratón</dt><dd>Toca para hacer clic, o activa el trackpad en el menú: el puntero se mueve como en un portátil.</dd>
      <dt>Teclado</dt><dd>Menú → Teclado; 🌐 cambia el método de entrada del ordenador (chino y otros).</dd>
      <dt>Archivos</dt><dd>Suelta archivos en el visor y llegan a Downloads/RemoDroid del ordenador.</dd>
      <dt>Portapapeles</dt><dd>El texto copiado se sincroniza en ambos sentidos.</dd></dl>`}
    <p style="margin-top:26px">${S.panel ? `<a class="btn" href="${esc(S.panel)}/" target="_blank" rel="noopener">Abre tu panel ↗</a> ` : ''}<a class="btn ghost" href="#step1" id="another">Añade también ${phone ? 'un ordenador' : 'un móvil'}</a> <a class="btn ghost" href="https://github.com/yinyue123/RemoDroid/blob/main/doc/es/README.md" target="_blank" rel="noopener">Lee la documentación ↗</a></p>`;
  $('#another').onclick = e => { e.preventDefault(); S.target = phone ? 'computer' : 'phone'; save(); go(3); };
}

go(step);
})();
</script>
</body>
</html>
