<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Installer RemoDroid</title>
<meta name="description" content="Jouez sur votre téléphone Android depuis un iPhone : installez le serveur RemoDroid (ou utilisez Cloudflare), l’agent du routeur, puis reliez-les.">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../setup.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./"><i>RD</i>RemoDroid</a>
  <span class="spacer"></span>
  <select class="link" aria-label="Langue" onchange="location.href=this.value" style="appearance:none;-webkit-appearance:none;background:none;cursor:pointer"><option value="../">English</option><option value="../zh/">简体中文</option><option value="../ja/">日本語</option><option value="../ko/">한국어</option><option value="../es/">Español</option><option value="../pt-BR/">Português (Brasil)</option><option value="../de/">Deutsch</option><option value="../fr/" selected>Français</option><option value="../ru/">Русский</option></select>
  <a class="link" href="https://github.com/yinyue123/RemoDroid/blob/main/doc/fr/README.md" target="_blank" rel="noopener">Docs ↗</a>
</header>
<nav class="steps" id="steps" aria-label="Étapes d’installation"></nav>
<main id="main" aria-live="polite"></main>
<footer class="foot">
  <button class="back" id="back" type="button">← Retour</button>
  <span class="left" id="left"></span>
  <button class="btn" id="next" type="button">Suivant →</button>
</footer>
<script>
(() => {
'use strict';
const SITE = location.origin.startsWith('http') && !/^(localhost|127\.)/.test(location.hostname) ? location.origin : 'https://remodroid.pages.dev';
const REPO = 'yinyue123/RemoDroid';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const main = $('#main');
const COPY = '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
const hl = s => esc(s).replace(/(\s)(--?[a-zA-Z-]+)/g, '$1<span class="f">$2</span>').replace(/(\|)/g, '<span class="f">$1</span>');
const cmd = t => `<div class="cmd"><code>${hl(t)}</code><button type="button" aria-label="Copier" data-copy="${esc(t)}">${COPY}</button></div>`;
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); } catch (_) {
    const ta = document.createElement('textarea'); ta.value = b.dataset.copy; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (__) {} ta.remove();
  }
  b.classList.add('ok'); b.innerHTML = '✓'; setTimeout(() => { b.classList.remove('ok'); b.innerHTML = COPY; }, 1400);
});

/* remembered between visits: which server and which router OS */
let S = { server: 'self', os: 'openwrt' };
try { Object.assign(S, JSON.parse(localStorage.getItem('rd-install') || '{}')); } catch (_) {}
const save = () => { try { localStorage.setItem('rd-install', JSON.stringify(S)); } catch (_) {} };

const STEPS = [
  { label: 'Serveur', sub: 'Installer' }, { label: 'Panneau', sub: 'Configurer' }, { label: 'Agent', sub: 'Installer' },
  { label: 'Relier', sub: 'Associer' }, { label: 'Téléphone', sub: 'USB' }, { label: 'Terminé', sub: 'Jouer' },
];
/* "remodroid.example.com" / "http://1.2.3.4:5580/" → "https://remodroid.example.com" / "http://1.2.3.4:5580" */
function panelUrl(v) {
  v = String(v || '').trim().replace(/\/+$/, '').replace(/\/(wizard|agent)\.html.*$/, '');
  if (!v) return '';
  if (!/^https?:\/\//.test(v)) v = (/^[\d.]+(:\d+)?$/.test(v) ? 'http://' : 'https://') + v;
  return v;
}
const panelField = id => `<div class="form" style="margin-top:6px"><div class="field"><label for="${id}">Adresse de votre panneau</label>
  <input id="${id}" type="text" inputmode="url" spellcheck="false" autocomplete="url" placeholder="https://remodroid.example.com  ou  http://203.0.113.10:5580" value="${esc(S.panel || '')}">
  <div class="hint">Mémorisée ici pour les étapes suivantes.</div></div></div>`;
function bindPanel(id, after) {
  const el = document.getElementById(id);
  el.addEventListener('change', () => { S.panel = panelUrl(el.value); el.value = S.panel; save(); if (after) after(); });
}
let step = Math.min(+(location.hash.match(/^#step(\d)$/) || [0, 1])[1] - 1, STEPS.length - 1);
if (!(step >= 0)) step = 0;

function renderSteps() {
  $('#steps').innerHTML = STEPS.map((s, i) => `${i ? `<span class="bar${i <= step ? ' done' : ''}"></span>` : ''}<button class="st${i === step ? ' on' : i < step ? ' done' : ''}" type="button" data-i="${i}"><span class="n">${i < step ? '✓' : i + 1}</span><span><b>${s.label}</b><small>${s.sub}</small></span></button>`).join('');
  $('#steps').querySelectorAll('[data-i]').forEach(b => b.onclick = () => go(+b.dataset.i));
  $('#back').disabled = step === 0;
  const left = STEPS.length - 1 - step;
  $('#left').textContent = left ? `encore ${left} ${left === 1 ? 'étape' : 'étapes'}` : 'tout est prêt';
  $('#next').hidden = step === STEPS.length - 1;
}
function go(i) { step = i; history.replaceState(null, '', '#step' + (i + 1)); renderSteps(); PAGES[i](); window.scrollTo(0, 0); }
$('#back').onclick = () => go(Math.max(0, step - 1));
$('#next').onclick = () => go(Math.min(STEPS.length - 1, step + 1));
const eyebrow = (n, t) => `<p class="eyebrow">${String(n).padStart(2, '0')} — ${t}</p>`;

/* ---------- release assets (for "download the package") ---------- */
let assets = null;
async function loadAssets() {
  if (assets) return assets;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
    const j = await r.json();
    assets = { tag: j.tag_name, list: (j.assets || []).map(a => ({ name: a.name, url: a.browser_download_url, size: a.size })) };
  } catch (_) { assets = { tag: '', list: [] }; }
  return assets;
}
const MB = n => (n / 1048576).toFixed(1) + ' MB';
async function fillDownloads(el, who, os, cpu) {
  const a = await loadAssets();
  const re = {
    openwrt: new RegExp(`^remodroid-${who}_.*_(${cpu === 'x86_64' ? 'x86_64' : cpu === 'aarch64' ? 'aarch64_[a-z0-9-]+' : cpu === 'armv7' ? 'arm_[a-z0-9_-]+' : cpu === 'mipsel' ? 'mipsel_24kc' : cpu === 'mips' ? 'mips_24kc' : 'i386_pentium4'})\\.ipk$`),
    debian: new RegExp(`^remodroid-${who}_.*_${{ x86_64: 'amd64', aarch64: 'arm64', armv7: 'armhf', x86: 'i386' }[cpu] || 'none'}\\.deb$`),
    rhel: new RegExp(`^remodroid-${who}-.*\\.${{ x86_64: 'x86_64', aarch64: 'aarch64', armv7: 'armv7hl', x86: 'i686' }[cpu] || 'none'}\\.rpm$`),
    alpine: new RegExp(`^remodroid-${who}_.*_${{ x86_64: 'x86_64', aarch64: 'aarch64', armv7: 'armv7', x86: 'x86' }[cpu] || 'none'}\\.apk$`),
  }[os];
  const hits = a.list.filter(x => re.test(x.name));
  el.innerHTML = hits.length ? hits.map(x => `<a class="btn" style="margin:0 10px 10px 0" href="${esc(x.url)}"><span>Télécharger</span><small style="font:12px var(--mono);opacity:.7">${esc(x.name)} · ${MB(x.size)}</small></a>`).join('')
    : `<p class="note">Aucun paquet pour cette combinaison dans ${esc(a.tag || 'la dernière version')}. Voir <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">tous les fichiers</a> (le <code>.tar.gz</code> fonctionne sur n’importe quel Linux).</p>`;
}

const OS = {
  openwrt: { name: 'OpenWrt', agent: `wget -qO- ${SITE}/install_agent.sh | sh`, install: 'opkg install ./remodroid-agent_*.ipk', cpus: ['mipsel', 'mips', 'armv7', 'aarch64', 'x86_64'] },
  debian: { name: 'Debian · Ubuntu', agent: `curl -fsSL ${SITE}/install_agent.sh | sudo sh`, install: 'sudo apt install ./remodroid-*.deb', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
  rhel: { name: 'CentOS · Fedora', agent: `curl -fsSL ${SITE}/install_agent.sh | sudo sh`, install: 'sudo dnf install ./remodroid-*.rpm', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
  alpine: { name: 'Alpine', agent: `wget -qO- ${SITE}/install_agent.sh | sh`, install: 'apk add --allow-untrusted ./remodroid-*.apk', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
};
/* starting what a package installed */
const SERVER_START = {
  debian: 'sudo systemctl enable --now remodroid-server',
  rhel: 'sudo systemctl enable --now remodroid-server',
  alpine: 'rc-update add remodroid-server && rc-service remodroid-server start',
};
const AGENT_START = {
  openwrt: '/etc/init.d/remodroid-agent enable && /etc/init.d/remodroid-agent start',
  debian: 'sudo systemctl enable --now remodroid-agent',
  rhel: 'sudo systemctl enable --now remodroid-agent',
  alpine: 'rc-update add remodroid-agent && rc-service remodroid-agent start',
};
const CPU = { mipsel: 'MIPS (LE)', mips: 'MIPS (BE)', armv7: 'ARMv7', aarch64: 'ARM64', x86_64: 'x86_64', x86: 'x86' };

/* ---------- 1. server ---------- */
function pageServer() {
  const self = S.server === 'self';
  main.innerHTML = `${eyebrow(1, 'serveur')}<h1>Choisissez un <em>serveur</em></h1>
    <p class="lede">Là où vos routeurs et votre iPhone se retrouvent. Sur votre propre machine Linux, ou gratuitement chez Cloudflare.</p>
    <div class="choices">
      <button class="choice" type="button" data-s="cf" aria-pressed="${!self}"><small>Pas besoin de serveur</small><b>Je n’ai pas de serveur</b><span>Le panneau tourne sur Cloudflare Workers. Offre gratuite, HTTPS et TURN inclus.</span></button>
      <button class="choice" type="button" data-s="self" aria-pressed="${self}"><small>Auto-hébergé</small><b>J’ai mon propre serveur</b><span>N’importe quelle machine Linux avec une IP publique. Contrôle total, relais TURN intégré.</span></button>
    </div>
    <div id="detail"></div>`;
  main.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.server = b.dataset.s; save(); pageServer(); });
  const d = $('#detail');
  if (self) {
    const one = `curl -fsSL ${SITE}/install_server.sh | sudo sh`;
    d.innerHTML = `<div class="num"><i>1</i>Une ligne, sur n’importe quel Linux</div>
      <p class="bullet">Télécharge, installe et démarre le serveur, tout en un.</p>
      ${cmd(one)}
      <div class="term"><div><span class="p">$</span> ${esc(one)}</div><div class="d">▸ downloading remodroid-server_…_amd64.deb</div><div class="d">▸ starting the service</div><div class="k">✓ the server is running. Open the setup wizard:</div><div>    http://203.0.113.10:5580/wizard.html?token=d93kss5mrwsc</div></div>
      <p class="note">Gardez le lien qu’il affiche : l’étape suivante l’ouvre.</p>
      <div class="num"><i class="alt">2</i>Ou installez un paquet</div>
      <div class="seg" id="sos">${['debian', 'rhel', 'alpine'].map(k => `<button type="button" data-os="${k}" aria-selected="${(S.sos || 'debian') === k}">${OS[k].name}</button>`).join('')}</div>
      <div class="seg" id="scpu">${['x86_64', 'aarch64'].map(k => `<button type="button" data-cpu="${k}" aria-selected="${(S.scpu || 'x86_64') === k}">${CPU[k]}</button>`).join('')}</div>
      <div id="sdl"><p class="note">Recherche de la dernière version…</p></div>
      ${cmd(OS[S.sos || 'debian'].install.replace('remodroid-', 'remodroid-server').replace('-*', '*'))}
      <div class="num"><i class="alt">3</i>Démarrez-le</div>
      <p class="bullet">Un paquet installe seulement le serveur. Démarrez-le et faites-le redémarrer après un redémarrage :</p>
      ${cmd(SERVER_START[S.sos || 'debian'])}
      <p>Ouvrez ensuite <code>http://&lt;ip-du-serveur&gt;:5580/wizard.html</code>. Le code de configuration est dans <code>/var/lib/remodroid/setup-token</code> ; le port est <code>listen</code> dans <code>/etc/remodroid/server.ini</code>.</p>`;
    d.querySelectorAll('[data-os]').forEach(b => b.onclick = () => { S.sos = b.dataset.os; save(); pageServer(); });
    d.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.scpu = b.dataset.cpu; save(); pageServer(); });
    fillDownloads($('#sdl'), 'server', S.sos || 'debian', S.scpu || 'x86_64');
  } else {
    const deploy = `git clone https://github.com/${REPO} && cd RemoDroid/worker\nnpm install && npx wrangler deploy`;
    d.innerHTML = `<div class="num"><i>1</i>Créez une clé TURN</div>
      <p>Cloudflare relaie la vidéo quand un réseau bloque les connexions directes (1 000 Go par mois gratuits). Dans le <a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">tableau de bord</a> : <b>Realtime</b> → <b>TURN Server</b> → <b>Create</b>. Gardez le <b>Turn Token ID</b> et l’<b>API Token</b> pour l’étape suivante.</p>
      <div class="num"><i>2</i>Déployez le Worker</div>
      <p class="bullet">Depuis un ordinateur avec Node.js ; il vous demande de vous connecter à Cloudflare une fois.</p>
      ${cmd(deploy)}
      <div class="term"><div><span class="p">$</span> npx wrangler deploy</div><div class="d">▸ Uploaded remodroid (web assets, Durable Object "Hub")</div><div class="k">✓ Deployed: https://remodroid.&lt;you&gt;.workers.dev</div></div>
      <p class="note">Ou sans terminal : forkez <a href="https://github.com/${REPO}" target="_blank" rel="noopener">${REPO}</a>, puis dans le tableau de bord <b>Workers &amp; Pages</b> → <b>Create</b> → <b>Import a repository</b> → choisissez votre fork → <b>Root directory: worker</b> → Deploy. Le stockage (la base de données du Durable Object) est créé tout seul.</p>`;
  }
}

/* ---------- 2. panel: run it, open it, finish its setup ---------- */
function pagePanel() {
  const self = S.server === 'self';
  if (self) {
    main.innerHTML = `${eyebrow(2, 'panneau')}<h1>Ouvrez votre <em>panneau</em></h1>
      <p class="lede">Le serveur est le panneau : une page web sur votre serveur où vous vous connectez, ajoutez des routeurs et jouez.</p>
      <div class="num"><i>1</i>Lancez le serveur</div>
      <p class="bullet">L’installeur en une ligne l’a déjà démarré. Vous avez installé un paquet vous-même ? Démarrez-le maintenant :</p>
      ${cmd('sudo systemctl enable --now remodroid-server')}
      <p class="note">Alpine: <code>rc-update add remodroid-server &amp;&amp; rc-service remodroid-server start</code> · vérifier : <code>systemctl status remodroid-server</code> (Alpine: <code>rc-service remodroid-server status</code>)</p>
      <div class="num"><i>2</i>Ouvrez sa page web</div>
      <p>Ouvrez le lien affiché par l’installeur : <code>http://&lt;ip-du-serveur&gt;:5580/wizard.html?token=…</code>. Le <b>token</b> prouve que le serveur est à vous. Lien perdu ? Lisez le token sur le serveur :</p>
      ${cmd('sudo cat /var/lib/remodroid/setup-token')}
      <div class="chips"><small>À ouvrir d’abord</small><span class="chip">TCP 5580</span><span class="chip">TCP 80 · 443 (domaine)</span><span class="chip">UDP 3478</span><span class="chip">UDP 49152–49252</span></div>
      <div class="num"><i>3</i>Terminez l’assistant de configuration</div>
      <p>Il demande <b>un domaine</b> (HTTPS gratuit de Let’s Encrypt, renouvelé tout seul), <b>votre identifiant</b> et le <b>port STUN/TURN</b>, écrit <code>/etc/remodroid/server.ini</code> et redémarre le serveur à votre adresse. Ensuite, la même page (protégée par votre mot de passe) modifie les réglages.</p>
      <div class="num"><i class="alt">4</i>Où est-il maintenant ?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  } else {
    main.innerHTML = `${eyebrow(2, 'panneau')}<h1>Ouvrez votre <em>panneau</em></h1>
      <p class="lede">Votre Worker est le panneau : une page web où vous vous connectez, ajoutez des routeurs et jouez.</p>
      <div class="num"><i>1</i>Ouvrez votre Worker</div>
      <p>Son adresse est affichée par <code>wrangler deploy</code>, et dans le tableau de bord : <b>Workers &amp; Pages</b> → <b>remodroid</b> → <b>Visit</b>. En général <code>https://remodroid.&lt;vous&gt;.workers.dev</code>.</p>
      <div class="num"><i>2</i>Terminez l’assistant de configuration</div>
      <p>Il demande <b>votre identifiant</b> et la <b>clé TURN</b> de l’étape précédente (ou d’autres serveurs STUN/TURN). Vous voulez votre propre adresse ? Worker → <b>Settings</b> → <b>Domains &amp; Routes</b> → ajoutez un domaine personnalisé.</p>
      <div class="callout">Faites-le juste après le déploiement : d’ici là, le premier visiteur choisit l’identifiant. Par précaution, ajoutez une variable <code>SETUP_TOKEN</code> au Worker ; l’assistant la demandera.</div>
      <div class="num"><i class="alt">3</i>Où est-il ?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  }
  const open = () => { $('#open').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/" target="_blank" rel="noopener">Ouvrir ${esc(S.panel.replace(/^https?:\/\//, ''))} ↗</a>` : ''; };
  bindPanel('panel', open);
  open();
}

/* ---------- 3. agent ---------- */
function pageAgent() {
  const o = OS[S.os];
  const cpu = o.cpus.includes(S.cpu) ? S.cpu : o.cpus[0];
  main.innerHTML = `${eyebrow(3, 'agent')}<h1>Installez l’<em>agent</em></h1>
    <p class="lede">Il tourne sur le routeur où le téléphone est branché et se connecte de lui-même à votre panneau. Aucun port ouvert, aucune adresse publique.</p>
    <div class="seg">${Object.entries(OS).map(([k, v]) => `<button type="button" data-os="${k}" aria-selected="${k === S.os}">${v.name}</button>`).join('')}</div>
    <div class="num"><i>1</i>Une commande</div>
    <p class="bullet">Télécharge, installe et démarre l’agent, tout en un. À lancer sur le routeur (SSH).</p>
    ${cmd(o.agent)}
    <div class="term"><div><span class="p">$</span> ${esc(o.agent)}</div><div class="d">▸ downloading remodroid-agent_…_${S.os === 'openwrt' ? 'mipsel_24kc.ipk' : 'amd64.deb'}</div><div class="d">▸ starting the service</div><div class="k">✓ the agent is running</div></div>
    <div class="num"><i class="alt">2</i>Ou téléchargez le paquet</div>
    <div class="seg">${o.cpus.map(k => `<button type="button" data-cpu="${k}" aria-selected="${k === cpu}">${CPU[k]}</button>`).join('')}</div>
    <div id="adl"><p class="note">Recherche de la dernière version…</p></div>
    ${cmd(o.install.replace('remodroid-*', 'remodroid-agent*').replace('remodroid-agent_*', 'remodroid-agent_*'))}
    <div class="num"><i class="alt">3</i>Démarrez-le</div>
    <p class="bullet">Un paquet installe seulement l’agent. Démarrez-le et faites-le redémarrer après un redémarrage :</p>
    ${cmd(AGENT_START[S.os])}
    <p class="note">Reliez-le ensuite à votre panneau : c’est l’étape suivante.</p>
    <div class="chips"><small>Il faut</small><span class="chip">un port USB</span><span class="chip">${S.os === 'openwrt' ? 'ca-bundle (installé avec)' : 'ca-certificates'}</span><span class="chip">la bonne heure (HTTPS)</span></div>`;
  main.querySelectorAll('[data-os]').forEach(b => b.onclick = () => { S.os = b.dataset.os; save(); pageAgent(); });
  main.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.cpu = b.dataset.cpu; save(); pageAgent(); });
  fillDownloads($('#adl'), 'agent', S.os, cpu);
}

/* ---------- 4. connect: the code comes from your panel ---------- */
function pageConnect() {
  main.innerHTML = `${eyebrow(4, 'relier')}<h1>Associez <em>le routeur</em></h1>
    <p class="lede">Le routeur rejoint votre panneau avec un code à usage unique que seul votre panneau peut créer.</p>
    ${S.panel ? '' : panelField('panel')}
    <div class="num"><i>1</i>Ouvrez l’onglet Agents de votre panneau</div>
    <p id="routers"></p>
    <div class="num"><i>2</i>Ajoutez un agent</div>
    <p>Ce lien ouvre <b>Add an agent → Connect</b> (ou cliquez vous-même). Votre panneau affiche un code comme <code>X5SX-K3M7</code> : à usage unique, valable <b>10 minutes</b>. La page indique la commande complète avec un bouton de copie ; ou tapez le code ici.</p>
    <div class="form"><div class="field"><label for="code">Code de votre panneau</label><input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="9" style="font-family:var(--mono);letter-spacing:.08em"></div></div>
    <div class="num"><i>3</i>Lancez-la sur le routeur</div>
    <div id="enroll"></div>
    <div class="term" id="term"></div>
    <p class="note">Quand il affiche <b>bound</b>, la page de votre panneau passe aussi au vert. Ensuite, les réglages vidéo, téléphone et presse-papiers du routeur se font dans l’onglet Agents du panneau, sans toucher au fichier ini.</p>`;
  const draw = () => {
    const code = ($('#code').value || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
    const c = code.length === 8 ? code.slice(0, 4) + '-' + code.slice(4) : '';
    const p = S.panel || 'https://your.panel';
    const line = `remodroid enroll --panel ${p} --code ${c || 'XXXX-XXXX'}`;
    $('#routers').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/agent.html#connect" target="_blank" rel="noopener">Ouvrir ${esc(S.panel.replace(/^https?:\/\//, ''))}/agent.html ↗</a>`
      : 'Saisissez l’adresse de votre panneau ci-dessus, ou ouvrez-le vous-même et allez dans <b>Agents → Add</b>.';
    $('#enroll').innerHTML = c && S.panel ? cmd(line) : `<div class="cmd"><code style="color:var(--faint)">${esc(line)}</code></div><p class="note">${S.panel ? 'Saisissez ci-dessus le code de votre panneau.' : 'Saisissez l’adresse de votre panneau et le code.'}</p>`;
    $('#term').innerHTML = `<div><span class="p">$</span> ${esc(line)}</div><div class="d">▸ contacting the panel ${esc(p)}…</div><div class="d">▸ enrolled as "OpenWrt" (openwrt); saved in /etc/remodroid/agent.ini</div><div class="k">✓ bound — this router is online</div>`;
  };
  $('#code').addEventListener('input', draw);
  if (!S.panel) bindPanel('panel', () => pageConnect());
  draw();
}

/* ---------- 5. phone ---------- */
function pagePhone() {
  main.innerHTML = `${eyebrow(5, 'téléphone')}<h1>Branchez <em>le téléphone</em></h1>
    <p class="lede">Une fois par téléphone. Android 8 ou plus récent ; un encodeur H.265 matériel aide, mais n’est pas nécessaire.</p>
    <div class="num"><i>1</i>Activez le débogage USB</div>
    <p>Paramètres → À propos du téléphone → appuyez sept fois sur <b>Numéro de build</b>. Puis Paramètres → Système → <b>Options pour les développeurs</b> → <b>Débogage USB</b>.</p>
    <div class="num"><i>2</i>Branchez-le sur le port USB du routeur</div>
    <p>Avec un câble de données, pas un câble de charge seule. L’agent trouve le téléphone tout seul et y installe son petit serveur (rien depuis le Play Store).</p>
    <div class="num"><i>3</i>Autorisez le routeur</div>
    <p>Le téléphone demande <b>« Autoriser le débogage USB ? »</b>. Cochez <b>Toujours autoriser cet ordinateur</b>, puis <b>Autoriser</b>. ${S.panel ? `<a href="${esc(S.panel)}/agent.html" target="_blank" rel="noopener">L’onglet Agents du panneau</a>` : 'L’onglet Agents du panneau'} affiche alors le téléphone comme prêt.</p>`;
}

/* ---------- 6. done ---------- */
function pageDone() {
  main.innerHTML = `${eyebrow(6, 'terminé')}<h1>À vous de <em>jouer</em></h1>
    <p class="lede">Ouvrez votre panneau dans Safari sur l’iPhone, connectez-vous, puis <b>Partager</b> → <b>Sur l’écran d’accueil</b> pour le plein écran.</p>
    <dl class="kv"><dt>Tactile</dt><dd>Le multi-touch va directement au téléphone ; la bulle flottante ouvre le menu.</dd>
      <dt>Qualité</dt><dd>Menu → Settings : définition, images par seconde, débit, H.265 ou H.264.</dd>
      <dt>Photos</dt><dd>Menu → Photo : de l’iPhone vers la galerie du téléphone.</dd>
      <dt>Presse-papiers</dt><dd>Du texte dans les deux sens ; un geste en HTTPS.</dd></dl>
    <p style="margin-top:26px">${S.panel ? `<a class="btn" href="${esc(S.panel)}/" target="_blank" rel="noopener">Ouvrir votre panneau ↗</a> ` : ''}<a class="btn ghost" href="https://github.com/${REPO}/blob/main/doc/fr/README.md" target="_blank" rel="noopener">Lire la documentation ↗</a></p>`;
}

const PAGES = [pageServer, pagePanel, pageAgent, pageConnect, pagePhone, pageDone];
go(step);
})();
</script>
