<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RemoDroid installieren</title>
<meta name="description" content="Steuere ein Android-Handy oder einen Windows-, Mac- oder Linux-Computer vom iPhone aus: Richte ein Panel ein (auf Cloudflare, einem Linux-Server oder einem Windows-Server), dann RemoDroid auf dem, was du steuern willst.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/setup.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./"><i>RD</i>RemoDroid</a>
  <span class="spacer"></span>
  <select class="link" aria-label="Sprache" onchange="location.href=this.value" style="appearance:none;-webkit-appearance:none;background:none;cursor:pointer"><option value="/">English</option><option value="/zh/">简体中文</option><option value="/ja/">日本語</option><option value="/ko/">한국어</option><option value="/es/">Español</option><option value="/pt-BR/">Português (Brasil)</option><option value="/de/" selected>Deutsch</option><option value="/fr/">Français</option><option value="/ru/">Русский</option></select>
  <a class="link" href="https://github.com/yinyue123/RemoDroid/blob/main/doc/de/README.md" target="_blank" rel="noopener">Doku ↗</a>
</header>
<nav class="steps" id="steps" aria-label="Installationsschritte"></nav>
<main id="main" aria-live="polite"></main>
<footer class="foot">
  <button class="back" id="back" type="button">← Zurück</button>
  <span class="left" id="left"></span>
  <button class="btn" id="next" type="button">Weiter →</button>
</footer>
<script>
(() => {
'use strict';
const SITE = location.origin.startsWith('http') && !/^(localhost|127\.)/.test(location.hostname) ? location.origin : 'https://remodroid.pages.dev';
const REPO = 'yinyue123/RemoDroid';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const main = $('#main');
/* every icon and picture is in /icons.svg, shared by all the languages */
const ic = (k, c) => `<svg class="${c || 'ico'}" aria-hidden="true"><use href="/icons.svg#${k}"/></svg>`;
const COPY = ic('copy', 'cp');
const hl = s => esc(s).replace(/(\s)(--?[a-zA-Z-]+)/g, '$1<span class="f">$2</span>').replace(/(\|)/g, '<span class="f">$1</span>');
const cmd = t => `<div class="cmd"><code>${hl(t)}</code><button type="button" aria-label="Kopieren" data-copy="${esc(t)}">${COPY}</button></div>`;
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); } catch (_) {
    const ta = document.createElement('textarea'); ta.value = b.dataset.copy; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (__) {} ta.remove();
  }
  b.classList.add('ok'); b.innerHTML = '✓'; setTimeout(() => { b.classList.remove('ok'); b.innerHTML = COPY; }, 1400);
});

/* remembered between visits: what you control, where the panel is, which OS */
let S = { target: 'phone', server: 'cf', os: 'openwrt', dos: '' };
try { Object.assign(S, JSON.parse(localStorage.getItem('rd-install') || '{}')); } catch (_) {}
const save = () => { try { localStorage.setItem('rd-install', JSON.stringify(S)); } catch (_) {} };

if (!['cf', 'self', 'win'].includes(S.server)) S.server = 'cf';
if (!S.dos) S.dos = /Mac/.test(navigator.platform) ? 'macos' : /Linux/.test(navigator.platform) && !/Android/.test(navigator.userAgent) ? 'linux' : 'windows';
const PANEL_ON = { cf: 'Cloudflare', self: 'einem Linux-Server', win: 'einem Windows-Server' };
/* the steps follow from the two answers on the first page */
const stepsFor = () => [
  { label: 'Start', sub: 'Wählen', page: pageStart },
  { label: 'Panel', sub: 'Installieren', page: pageServer },
  { label: 'Panel', sub: 'Öffnen', page: pagePanel },
  ...(S.target === 'phone'
    ? [{ label: 'Router', sub: 'Installieren', page: pageAgent }, { label: 'Verbinden', sub: 'Registrieren', page: pageConnect }, { label: 'Handy', sub: 'USB', page: pagePhone }]
    : [{ label: 'Computer', sub: 'Installieren', page: pageComputer }, { label: 'Verbinden', sub: 'Koppeln', page: pagePair }]),
  { label: 'Fertig', sub: 'Loslegen', page: pageDone },
];
let STEPS = stepsFor();
/* "remodroid.example.com" / "http://1.2.3.4:5580/" → "https://remodroid.example.com" / "http://1.2.3.4:5580" */
function panelUrl(v) {
  v = String(v || '').trim().replace(/\/+$/, '').replace(/\/(wizard|agent)\.html.*$/, '');
  if (!v) return '';
  if (!/^https?:\/\//.test(v)) v = (/^[\d.]+(:\d+)?$/.test(v) ? 'http://' : 'https://') + v;
  return v;
}
const panelField = id => `<div class="form" style="margin-top:6px"><div class="field"><label for="${id}">Adresse deines Panels</label>
  <input id="${id}" type="text" inputmode="url" spellcheck="false" autocomplete="url" placeholder="https://remodroid.example.com  oder  http://203.0.113.10:5580" value="${esc(S.panel || '')}">
  <div class="hint">Wird hier für die nächsten Schritte gemerkt.</div></div></div>`;
function bindPanel(id, after) {
  const el = document.getElementById(id);
  el.addEventListener('change', () => { S.panel = panelUrl(el.value); el.value = S.panel; save(); if (after) after(); });
}
let step = Math.min(+(location.hash.match(/^#step(\d)$/) || [0, 1])[1] - 1, STEPS.length - 1);
if (!(step >= 0)) step = 0;

function renderSteps() {
  $('#steps').innerHTML = STEPS.map((s, i) => `${i ? `<span class="bar${i <= step ? ' done' : ''}"></span>` : ''}<button class="st${i === step ? ' on' : i < step ? ' done' : ''}" type="button" data-i="${i}"><span class="n">${i < step ? '✓' : i + 1}</span><span><b>${s.label}</b><small>${s.sub}</small></span></button>`).join('');
  $('#steps').querySelectorAll('[data-i]').forEach(b => b.onclick = () => go(+b.dataset.i));
  $('#back').disabled = step === 0;
  const left = STEPS.length - 1 - step;
  $('#left').textContent = left ? `noch ${left} Schritt${left > 1 ? 'e' : ''}` : 'alles erledigt';
  $('#next').hidden = step === STEPS.length - 1;
}
function go(i) { STEPS = stepsFor(); step = i; history.replaceState(null, '', '#step' + (i + 1)); renderSteps(); STEPS[i].page(); window.scrollTo(0, 0); }
$('#back').onclick = () => go(Math.max(0, step - 1));
$('#next').onclick = () => go(Math.min(STEPS.length - 1, step + 1));
const eyebrow = (n, t) => `<p class="eyebrow">${String(n).padStart(2, '0')} — ${t}</p>`;

/* ---------- the picture of your setup, on every step ---------- */
const NAMES = { iphone: 'iPhone', panel: 'Panel', router: 'Router', phone: 'Android', computer: 'Computer' };
/* what each page is about: [the part in focus, the link being made] */
const FOCUS = { pageServer: ['panel'], pagePanel: ['panel', 'w1'], pageAgent: ['router'], pageConnect: ['router', 'w2'], pagePhone: ['phone', 'w3'], pageComputer: ['computer'], pagePair: ['computer', 'w2'], pageDone: ['iphone', 'video'] };
function scene(name) {
  const phone = S.target === 'phone', parts = ['iphone', 'panel', ...(phone ? ['router', 'phone'] : ['computer'])];
  const xs = phone ? [70, 236, 404, 570] : [90, 320, 550], [on, link] = FOCUS[name] || [];
  const v = { [`--s-${S.server}`]: 1 };
  if (name === 'pageDone') {
    parts.forEach(k => { v[`--s-${k}-c`] = v[`--s-${k}-line`] = 'var(--ok)'; v[`--s-${k}-bg`] = 'var(--ok-soft)'; });
    Object.assign(v, { '--s-badge': 'var(--ok)', '--s-get': 0, '--s-ok': 1, '--s-w1-c': 'var(--ok)', '--s-w2-c': 'var(--ok)', '--s-w3-c': 'var(--ok)' });
  } else if (on) {
    parts.forEach(k => { if (k !== on) v[`--s-${k}-o`] = 0.4; });
    ['w1', 'w2', 'w3', 'video'].forEach(k => { if (k !== link) v[`--s-${k}-o`] = 0.4; });
    Object.assign(v, { [`--s-${on}-c`]: 'var(--accent)', [`--s-${on}-line`]: 'var(--accent)', [`--s-${on}-bg`]: 'var(--accent-soft)' });
  }
  if (link) Object.assign(v, { [`--s-${link}-c`]: 'var(--accent)', [`--s-${link}-i`]: 'var(--accent)' });
  const style = Object.entries(v).map(([k, x]) => `${k}:${x}`).join(';');
  return `<figure class="scene${link ? ' live' : ''}" style="${style}"><svg viewBox="0 0 640 138" role="img" aria-label="${parts.map(k => NAMES[k]).join(' → ')}"><use href="/icons.svg#scene-${phone ? 'phone' : 'computer'}"/></svg>`
    + `<figcaption>${parts.map((k, i) => `<span style="left:${xs[i] / 6.4}%">${NAMES[k]}</span>`).join('')}</figcaption></figure>`;
}
const DEMOS = [
  ['pageServer', 'win', '.chips', 'firewall'], ['pageServer', 'self', '#detail > p:last-child', 'firewall'],
  ['pagePanel', 'win', 0, 'winserver'],
  ['pagePhone', '', 0, 'android-debug'], ['pagePhone', '', 2, 'android-allow'],
  ['pagePair', '', '#padd + p', 'panel-add'], ['pagePair', '', 1, 'pair'],
];
/* pages redraw themselves (a tab, a new address, downloads arriving), so this runs after every redraw */
function decorate() {
  const name = STEPS[step].page.name;
  if (!main.querySelector('.scene')) {
    const at = name === 'pageStart' ? main.querySelector('.choices ~ .note') : main.querySelector('.lede');
    if (at) at.insertAdjacentHTML(name === 'pageStart' ? 'beforebegin' : 'afterend', scene(name));
  }
  /* a picture of the screen under the step it shows: [page, which panel, after this step (or element), picture] */
  for (const [page, srv, at, pic] of DEMOS) {
    if (page !== name || (srv && srv !== S.server) || main.querySelector(`img[src="/demo/${pic}.svg"]`)) continue;
    let el = typeof at === 'string' ? main.querySelector(at) : main.querySelectorAll('.num')[at];
    if (typeof at === 'number') do el = el && el.nextElementSibling; while (el && (el.tagName !== 'P' || el.id));
    if (el) el.insertAdjacentHTML('afterend', `<img class="demo" src="/demo/${pic}.svg" alt="" loading="lazy">`);
  }
  main.querySelectorAll('.choice:not(.has-ic)').forEach(b => { b.classList.add('has-ic'); b.insertAdjacentHTML('afterbegin', ic(b.dataset.t || b.dataset.s, 'cic')); });
  main.querySelectorAll('.seg button:not(.has-ic)').forEach(b => {
    const d = b.dataset, k = d.os || d.dos || (d.cpu || d.dcpu ? 'cpu' : '');
    if (k) { b.classList.add('has-ic'); b.insertAdjacentHTML('afterbegin', ic(k)); }
  });
  main.querySelectorAll('a.btn[href*="/releases/download/"]:not(.has-ic)').forEach(b => { b.classList.add('has-ic'); b.insertAdjacentHTML('afterbegin', ic('get')); });
}
new MutationObserver(decorate).observe(main, { childList: true, subtree: true });

/* ---------- release assets (for "download the package") ---------- */
let assets = null;
async function loadAssets() {
  if (assets) return assets;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
    const j = await r.json();
    assets = { tag: j.tag_name, list: (j.assets || []).map(a => ({ name: a.name, url: a.browser_download_url, size: a.size })) };
  } catch (_) { assets = { tag: '', list: [] }; }
  return assets;
}
const MB = n => (n / 1048576).toFixed(1) + ' MB';
async function fillFiles(el, res) {
  const a = await loadAssets();
  const hits = a.list.filter(x => res.some(re => re.test(x.name)));
  el.innerHTML = hits.length ? hits.map(x => `<a class="btn" style="margin:0 10px 10px 0" href="${esc(x.url)}"><span>Herunterladen</span><small style="font:12px var(--mono);opacity:.7">${esc(x.name)} · ${MB(x.size)}</small></a>`).join('')
    : `<p class="note">Dafür gibt es nichts in ${esc(a.tag || 'der neuesten Version')}. Siehe <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">alle Dateien</a>.</p>`;
}
async function fillDownloads(el, who, os, cpu) {
  const a = await loadAssets();
  const re = {
    openwrt: new RegExp(`^remodroid-${who}_.*_(${cpu === 'x86_64' ? 'x86_64' : cpu === 'aarch64' ? 'aarch64_[a-z0-9-]+' : cpu === 'armv7' ? 'arm_[a-z0-9_-]+' : cpu === 'mipsel' ? 'mipsel_24kc' : cpu === 'mips' ? 'mips_24kc' : 'i386_pentium4'})\\.ipk$`),
    debian: new RegExp(`^remodroid-${who}_.*_${{ x86_64: 'amd64', aarch64: 'arm64', armv7: 'armhf', x86: 'i386' }[cpu] || 'none'}\\.deb$`),
    rhel: new RegExp(`^remodroid-${who}-.*\\.${{ x86_64: 'x86_64', aarch64: 'aarch64', armv7: 'armv7hl', x86: 'i686' }[cpu] || 'none'}\\.rpm$`),
    alpine: new RegExp(`^remodroid-${who}_.*_${{ x86_64: 'x86_64', aarch64: 'aarch64', armv7: 'armv7', x86: 'x86' }[cpu] || 'none'}\\.apk$`),
  }[os];
  const hits = a.list.filter(x => re.test(x.name));
  el.innerHTML = hits.length ? hits.map(x => `<a class="btn" style="margin:0 10px 10px 0" href="${esc(x.url)}"><span>Herunterladen</span><small style="font:12px var(--mono);opacity:.7">${esc(x.name)} · ${MB(x.size)}</small></a>`).join('')
    : `<p class="note">Kein Paket für diese Kombination in ${esc(a.tag || 'der neuesten Version')}. Siehe <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">alle Dateien</a> (das <code>.tar.gz</code> läuft auf jedem Linux).</p>`;
}

const OS = {
  openwrt: { name: 'OpenWrt', agent: `wget -qO- ${SITE}/install_agent.sh | sh`, install: 'opkg install ./remodroid-agent_*.ipk', cpus: ['mipsel', 'mips', 'armv7', 'aarch64', 'x86_64'] },
  debian: { name: 'Debian · Ubuntu', agent: `curl -fsSL ${SITE}/install_agent.sh | sudo sh`, install: 'sudo apt install ./remodroid-*.deb', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
  rhel: { name: 'CentOS · Fedora', agent: `curl -fsSL ${SITE}/install_agent.sh | sudo sh`, install: 'sudo dnf install ./remodroid-*.rpm', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
  alpine: { name: 'Alpine', agent: `wget -qO- ${SITE}/install_agent.sh | sh`, install: 'apk add --allow-untrusted ./remodroid-*.apk', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
};
/* starting what a package installed */
const SERVER_START = {
  debian: 'sudo systemctl enable --now remodroid-server',
  rhel: 'sudo systemctl enable --now remodroid-server',
  alpine: 'rc-update add remodroid-server && rc-service remodroid-server start',
};
const AGENT_START = {
  openwrt: '/etc/init.d/remodroid-agent enable && /etc/init.d/remodroid-agent start',
  debian: 'sudo systemctl enable --now remodroid-agent',
  rhel: 'sudo systemctl enable --now remodroid-agent',
  alpine: 'rc-update add remodroid-agent && rc-service remodroid-agent start',
};
const CPU = { mipsel: 'MIPS (LE)', mips: 'MIPS (BE)', armv7: 'ARMv7', aarch64: 'ARM64', x86_64: 'x86_64', x86: 'x86' };

/* ---------- 1. start: what you control, where the panel goes ---------- */
function pageStart() {
  const t = S.target, sv = S.server;
  main.innerHTML = `${eyebrow(1, 'start')}<h1>Zwei <em>Fragen</em></h1>
    <p class="lede">RemoDroid besteht aus zwei Teilen: einem <b>Panel</b>, der Webseite, auf der du dich anmeldest, und <b>RemoDroid auf dem, was du steuerst</b>. Benutzt wird es dann in Safari auf dem iPhone oder in jedem Browser, ohne dort etwas zu installieren.</p>
    <div class="num"><i>1</i>Was willst du steuern?</div>
    <div class="choices">
      <button class="choice" type="button" data-t="phone" aria-pressed="${t === 'phone'}"><small>RemoDroid für Handys</small><b>Ein Android-Handy</b><span>Per USB an deinem Router (OpenWrt, ASUS Merlin oder ein beliebiger Linux-Rechner). Auf dem Handy wird nichts installiert.</span></button>
      <button class="choice" type="button" data-t="computer" aria-pressed="${t === 'computer'}"><small>RemoDroid für Computer</small><b>Einen Computer</b><span>Windows 10 oder 11, ein Mac (macOS 13+) oder ein Linux-PC. Eine kleine App auf dem Computer selbst.</span></button>
    </div>
    <div class="num"><i>2</i>Wo soll das Panel laufen?</div>
    <div class="choices">
      <button class="choice" type="button" data-s="cf" aria-pressed="${sv === 'cf'}"><small>Kein Server nötig</small><b>Cloudflare</b><span>Kostenlos: Cloudflare hostet die Seite und leitet das Video weiter, wenn ein Netz die direkte Verbindung blockiert. Ein paar Minuten im Browser.</span></button>
      <button class="choice" type="button" data-s="self" aria-pressed="${sv === 'self'}"><small>Selbst gehostet</small><b>Ein Linux-Server</b><span>Ein VPS mit öffentlicher IP, am besten nah an zu Hause. Ein Befehl; eigenes TURN-Relay.</span></button>
      <button class="choice" type="button" data-s="win" aria-pressed="${sv === 'win'}"><small>Selbst gehostet</small><b>Ein Windows-Server</b><span>Windows Server 2019+, oder Windows 10/11 mit öffentlicher IP. Entpacken und auf Install klicken.</span></button>
    </div>
    <p class="note">Dein Plan: das Panel auf <b>${PANEL_ON[sv]}</b>, dann <b>${t === 'phone' ? 'RemoDroid für Handys auf deinem Router' : 'RemoDroid für Computer auf deinem Computer'}</b>, dann auf dem iPhone öffnen. Ein Panel bedient beliebig viele Handys und Computer: komm hierher zurück, um die andere Art hinzuzufügen.</p>`;
  main.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.target = b.dataset.t; save(); go(0); });
  main.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.server = b.dataset.s; save(); go(0); });
}

/* ---------- 2. the panel: install it where you chose ---------- */
const change = () => `<p class="note">Panel auf <b>${PANEL_ON[S.server]}</b>. <a href="#step1" data-go="0">Ändern</a></p>`;
function pageServer() {
  const self = S.server === 'self';
  main.innerHTML = `${eyebrow(2, 'panel')}<h1>Das <em>Panel</em> installieren</h1>
    <p class="lede">Im Panel treffen sich deine ${S.target === 'phone' ? 'Router' : 'Computer'} und dein iPhone: eine Webseite mit deinem Login.</p>
    ${change()}<div id="detail"></div>`;
  main.querySelector('[data-go]').onclick = e => { e.preventDefault(); go(0); };
  const d = $('#detail');
  if (S.server === 'win') {
    d.innerHTML = `<div class="num"><i>1</i>Herunterladen</div>
      <div class="seg" id="wcpu">${['x86_64', 'aarch64'].map(k => `<button type="button" data-cpu="${k}" aria-selected="${(S.wcpu || 'x86_64') === k}">${CPU[k]}</button>`).join('')}</div>
      <div id="wdl"><p class="note">Suche die neueste Version…</p></div>
      <div class="num"><i>2</i>Installieren und starten</div>
      <p>In einen Ordner entpacken, in dem es bleiben kann, <b>RemoDroidServer.exe</b> starten und <b>Install and start</b> wählen. Es betreibt das Panel als Windows-Dienst, der mit Windows startet, ob jemand angemeldet ist oder nicht, und gibt es in der Windows-Firewall frei. Sein Symbol bleibt neben der Uhr.</p>
      <p class="note">Stattdessen in der Eingabeaufforderung (als Administrator): <code>remodroid-server install</code></p>
      <div class="chips"><small>In der Firewall deiner Cloud öffnen</small><span class="chip">TCP 80 · 443 (Domain)</span><span class="chip">UDP 3478</span><span class="chip">UDP 49152–49252</span></div>`;
    d.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.wcpu = b.dataset.cpu; save(); pageServer(); });
    fillFiles($('#wdl'), [new RegExp(`^RemoDroid-Server-.*-windows-${(S.wcpu || 'x86_64') === 'aarch64' ? 'arm64' : 'x86_64'}\\.zip$`)]);
  } else if (self) {
    const one = `curl -fsSL ${SITE}/install_server.sh | sudo sh`;
    d.innerHTML = `<div class="num"><i>1</i>Eine Zeile — auf jedem Linux</div>
      <p class="bullet">Lädt den Server herunter, installiert und startet ihn — alles in einem.</p>
      ${cmd(one)}
      <div class="term"><div><span class="p">$</span> ${esc(one)}</div><div class="d">▸ lade remodroid-server_…_amd64.deb</div><div class="d">▸ starte den Dienst</div><div class="k">✓ der Server läuft. Öffne den Einrichtungsassistenten:</div><div>    http://203.0.113.10:5580/wizard.html?token=d93kss5mrwsc</div></div>
      <p class="note">Behalte den ausgegebenen Link: Der nächste Schritt öffnet ihn.</p>
      <div class="num"><i class="alt">2</i>Oder ein Paket installieren</div>
      <div class="seg" id="sos">${['debian', 'rhel', 'alpine'].map(k => `<button type="button" data-os="${k}" aria-selected="${(S.sos || 'debian') === k}">${OS[k].name}</button>`).join('')}</div>
      <div class="seg" id="scpu">${['x86_64', 'aarch64'].map(k => `<button type="button" data-cpu="${k}" aria-selected="${(S.scpu || 'x86_64') === k}">${CPU[k]}</button>`).join('')}</div>
      <div id="sdl"><p class="note">Suche die neueste Version…</p></div>
      ${cmd(OS[S.sos || 'debian'].install.replace('remodroid-', 'remodroid-server').replace('-*', '*'))}
      <div class="num"><i class="alt">3</i>Starten</div>
      <p class="bullet">Ein Paket installiert den Server nur. Starte ihn und lass ihn nach einem Neustart wieder starten:</p>
      ${cmd(SERVER_START[S.sos || 'debian'])}
      <p>Dann <code>http://&lt;Server-IP&gt;:5580/wizard.html</code> öffnen. Der Einrichtungscode steht in <code>/var/lib/remodroid/setup-token</code>; der Port ist <code>listen</code> in <code>/etc/remodroid/server.ini</code>.</p>`;
    d.querySelectorAll('[data-os]').forEach(b => b.onclick = () => { S.sos = b.dataset.os; save(); pageServer(); });
    d.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.scpu = b.dataset.cpu; save(); pageServer(); });
    fillDownloads($('#sdl'), 'server', S.sos || 'debian', S.scpu || 'x86_64');
  } else {
    const deploy = `git clone https://github.com/${REPO} && cd RemoDroid/worker\nnpm install && npx wrangler deploy`;
    d.innerHTML = `<div class="num"><i>1</i>Einen TURN-Schlüssel anlegen</div>
      <p>Cloudflare leitet das Video weiter, wenn ein Netz direkte Verbindungen blockiert (1.000 GB im Monat kostenlos). Im <a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Dashboard</a>: <b>Realtime</b> → <b>TURN Server</b> → <b>Create</b>. <b>Turn Token ID</b> und <b>API Token</b> für den nächsten Schritt aufheben.</p>
      <div class="num"><i>2</i>Den Worker bereitstellen</div>
      <p class="bullet">Auf einem Computer mit Node.js — beim ersten Mal fragt es nach dem Cloudflare-Login.</p>
      ${cmd(deploy)}
      <div class="term"><div><span class="p">$</span> npx wrangler deploy</div><div class="d">▸ remodroid hochgeladen (Web-Dateien, Durable Object "Hub")</div><div class="k">✓ Bereitgestellt: https://remodroid.&lt;du&gt;.workers.dev</div></div>
      <p class="note">Oder ohne Terminal: <a href="https://github.com/${REPO}" target="_blank" rel="noopener">${REPO}</a> forken, dann im Dashboard <b>Workers &amp; Pages</b> → <b>Create</b> → <b>Import a repository</b> → deinen Fork wählen → <b>Root directory: worker</b> → Deploy. Danach aktualisiert jeder Push in deinen Fork das Panel von selbst. Der Speicher (die Datenbank des Durable Objects) entsteht von allein.</p>`;
  }
}

/* ---------- 3. panel: run it, open it, finish its setup ---------- */
function pagePanel() {
  const self = S.server === 'self';
  if (S.server === 'win') {
    main.innerHTML = `${eyebrow(3, 'panel')}<h1>Dein <em>Panel</em> öffnen</h1>
      <p class="lede">Das Fenster von RemoDroid Server auf dem Windows-Rechner richtet das Panel ein; danach ist es eine Webseite, auf der du dich von überall anmeldest.</p>
      <div class="num"><i>1</i>Im Fenster einrichten</div>
      <p>In <b>RemoDroidServer.exe</b>: den <b>Administrator</b>-Login, den <b>Web-Port</b>, eine <b>Domain</b> für kostenloses HTTPS von Let's Encrypt (optional) und <b>STUN/TURN</b>. Dasselbe Fenster startet und stoppt das Panel und zeigt sein Log.</p>
      <div class="num"><i>2</i>Öffnen</div>
      <p>Von überall: <code>https://&lt;deine Domain&gt;</code>, oder ohne Domain <code>http://&lt;Server-IP&gt;:&lt;Web-Port&gt;</code>.</p>
      <div class="num"><i class="alt">3</i>Wo ist es jetzt?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  } else if (self) {
    main.innerHTML = `${eyebrow(3, 'panel')}<h1>Dein <em>Panel</em> öffnen</h1>
      <p class="lede">Der Server ist das Panel: eine Webseite auf deinem Server, auf der du dich anmeldest und hinzufügst, was du steuerst.</p>
      <div class="num"><i>1</i>Den Server starten</div>
      <p class="bullet">Der Einzeilen-Installer hat ihn schon gestartet. Selbst ein Paket installiert? Jetzt starten:</p>
      ${cmd('sudo systemctl enable --now remodroid-server')}
      <p class="note">Alpine: <code>rc-update add remodroid-server &amp;&amp; rc-service remodroid-server start</code> · prüfen: <code>systemctl status remodroid-server</code> (Alpine: <code>rc-service remodroid-server status</code>)</p>
      <div class="num"><i>2</i>Seine Webseite öffnen</div>
      <p>Öffne den Link, den der Installer ausgegeben hat: <code>http://&lt;Server-IP&gt;:5580/wizard.html?token=…</code>. Das <b>Token</b> beweist, dass der Server dir gehört. Link verloren? Lies das Token auf dem Server:</p>
      ${cmd('sudo cat /var/lib/remodroid/setup-token')}
      <div class="chips"><small>Zuerst öffnen</small><span class="chip">TCP 5580</span><span class="chip">TCP 80 · 443 (Domain)</span><span class="chip">UDP 3478</span><span class="chip">UDP 49152–49252</span></div>
      <div class="num"><i>3</i>Den Einrichtungsassistenten abschließen</div>
      <p>Er fragt nach <b>einer Domain</b> (kostenloses HTTPS von Let's Encrypt, erneuert sich selbst), <b>deinem Login</b> und dem <b>STUN/TURN-Port</b>, schreibt <code>/etc/remodroid/server.ini</code> und startet den Server auf deiner Adresse neu. Später ändert dieselbe Seite hinter deinem Passwort die Einstellungen.</p>
      <div class="num"><i class="alt">4</i>Wo ist es jetzt?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  } else {
    main.innerHTML = `${eyebrow(3, 'panel')}<h1>Dein <em>Panel</em> öffnen</h1>
      <p class="lede">Dein Worker ist das Panel: eine Webseite, auf der du dich anmeldest und hinzufügst, was du steuerst.</p>
      <div class="num"><i>1</i>Deinen Worker öffnen</div>
      <p>Seine Adresse gibt <code>wrangler deploy</code> aus, und im Dashboard: <b>Workers &amp; Pages</b> → <b>remodroid</b> → <b>Visit</b>. Meist <code>https://remodroid.&lt;du&gt;.workers.dev</code>.</p>
      <div class="num"><i>2</i>Den Einrichtungsassistenten abschließen</div>
      <p>Er fragt nach <b>deinem Login</b> und dem <b>TURN-Schlüssel</b> aus dem vorigen Schritt (oder anderen STUN/TURN-Servern). Eigene Adresse gewünscht? Worker → <b>Settings</b> → <b>Domains &amp; Routes</b> → eine eigene Domain hinzufügen.</p>
      <div class="callout">Erledige das direkt nach der Bereitstellung: Bis dahin legt der erste Besucher den Login fest. Sicherer: gib dem Worker zuerst ein Secret <code>SETUP_TOKEN</code> (Settings → Variables and Secrets → Add, Typ <b>Secret</b>; eine normale Variable geht bei der nächsten Bereitstellung verloren); die Einrichtungsseite fragt dann danach.</div>
      <div class="num"><i class="alt">3</i>Wo ist es?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  }
  const open = () => { $('#open').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/" target="_blank" rel="noopener">${esc(S.panel.replace(/^https?:\/\//, ''))} öffnen ↗</a>` : ''; };
  bindPanel('panel', open);
  open();
}

/* ---------- 4. RemoDroid for phones, on the router ---------- */
function pageAgent() {
  const o = OS[S.os];
  const cpu = o.cpus.includes(S.cpu) ? S.cpu : o.cpus[0];
  main.innerHTML = `${eyebrow(4, 'router')}<h1>RemoDroid für <em>Handys</em></h1>
    <p class="lede">Läuft auf dem Router, an dem das Handy hängt (oder auf jedem Linux-Rechner mit USB-Port), und verbindet sich selbst mit deinem Panel. Kein offener Port, keine öffentliche Adresse; auf das Handy selbst kommt nichts.</p>
    <div class="seg">${Object.entries(OS).map(([k, v]) => `<button type="button" data-os="${k}" aria-selected="${k === S.os}">${v.name}</button>`).join('')}</div>
    <div class="num"><i>1</i>Ein Befehl</div>
    <p class="bullet">Herunterladen, installieren und starten — alles in einem. Auf dem Router ausführen (SSH).</p>
    ${cmd(o.agent)}
    <div class="term"><div><span class="p">$</span> ${esc(o.agent)}</div><div class="d">▸ lade remodroid-agent_…_${S.os === 'openwrt' ? 'mipsel_24kc.ipk' : 'amd64.deb'}</div><div class="d">▸ starte den Dienst</div><div class="k">✓ läuft</div></div>
    <div class="num"><i class="alt">2</i>Oder das Paket herunterladen</div>
    <div class="seg">${o.cpus.map(k => `<button type="button" data-cpu="${k}" aria-selected="${k === cpu}">${CPU[k]}</button>`).join('')}</div>
    <div id="adl"><p class="note">Suche die neueste Version…</p></div>
    ${cmd(o.install.replace('remodroid-*', 'remodroid-agent*').replace('remodroid-agent_*', 'remodroid-agent_*'))}
    <div class="num"><i class="alt">3</i>Starten</div>
    <p class="bullet">Ein Paket installiert es nur. Starte es und lass es nach einem Neustart wieder starten:</p>
    ${cmd(AGENT_START[S.os])}
    <p class="note">Dann verbinde es mit deinem Panel: der nächste Schritt.</p>
    <div class="chips"><small>Braucht</small><span class="chip">einen USB-Port</span><span class="chip">${S.os === 'openwrt' ? 'ca-bundle (wird mitinstalliert)' : 'ca-certificates'}</span><span class="chip">die richtige Uhrzeit (HTTPS)</span></div>
    <p class="note">ASUS Merlin mit Koolshare: das <code>remodroid-…-merlin-….tar.gz</code> aus <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">der neuesten Version</a> nehmen und unter Software Center → Manual installation installieren.</p>`;
  main.querySelectorAll('[data-os]').forEach(b => b.onclick = () => { S.os = b.dataset.os; save(); pageAgent(); });
  main.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.cpu = b.dataset.cpu; save(); pageAgent(); });
  fillDownloads($('#adl'), 'agent', S.os, cpu);
}

/* ---------- 5. connect: the code comes from your panel ---------- */
function pageConnect() {
  main.innerHTML = `${eyebrow(5, 'verbinden')}<h1><em>Den Router</em> registrieren</h1>
    <p class="lede">Der Router tritt deinem Panel mit einem Einmalcode bei, den nur dein Panel erzeugen kann.</p>
    ${S.panel ? '' : panelField('panel')}
    <div class="num"><i>1</i>Den Agenten-Tab deines Panels öffnen</div>
    <p id="routers"></p>
    <div class="num"><i>2</i>Einen Agenten hinzufügen</div>
    <p>Der Link öffnet <b>Agenten hinzufügen → Verbinden</b> (oder klick es selbst an). Dein Panel zeigt einen Code wie <code>X5SX-K3M7</code>: einmalig, <b>10 Minuten</b> gültig. Die Seite dort hat den ganzen Befehl mit Kopierknopf; oder gib den Code hier ein.</p>
    <div class="form"><div class="field"><label for="code">Code von deinem Panel</label><input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="9" style="font-family:var(--mono);letter-spacing:.08em"></div></div>
    <div class="num"><i>3</i>Auf dem Router ausführen</div>
    <div id="enroll"></div>
    <div class="term" id="term"></div>
    <p class="note">Wenn <b>bound</b> erscheint, wird auch die Seite deines Panels grün. Ab dann liegen Video-, Handy- und Zwischenablage-Einstellungen des Routers im Agenten-Tab des Panels — keine ini-Datei bearbeiten.</p>`;
  const draw = () => {
    const code = ($('#code').value || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
    const c = code.length === 8 ? code.slice(0, 4) + '-' + code.slice(4) : '';
    const p = S.panel || 'https://your.panel';
    const line = `remodroid enroll --panel ${p} --code ${c || 'XXXX-XXXX'}`;
    $('#routers').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/agent.html#connect" target="_blank" rel="noopener">${esc(S.panel.replace(/^https?:\/\//, ''))}/agent.html öffnen ↗</a>`
      : 'Gib oben die Adresse deines Panels ein, oder öffne es selbst und geh zu <b>Agenten → Hinzufügen</b>.';
    $('#enroll').innerHTML = c && S.panel ? cmd(line) : `<div class="cmd"><code style="color:var(--faint)">${esc(line)}</code></div><p class="note">${S.panel ? 'Gib oben den Code von deinem Panel ein.' : 'Gib die Adresse deines Panels und den Code ein.'}</p>`;
    $('#term').innerHTML = `<div><span class="p">$</span> ${esc(line)}</div><div class="d">▸ kontaktiere das Panel ${esc(p)}…</div><div class="d">▸ registriert als "OpenWrt" (openwrt); gespeichert in /etc/remodroid/agent.ini</div><div class="k">✓ bound — dieser Router ist online</div>`;
  };
  $('#code').addEventListener('input', draw);
  if (!S.panel) bindPanel('panel', () => pageConnect());
  draw();
}

/* ---------- 6. phone ---------- */
function pagePhone() {
  main.innerHTML = `${eyebrow(6, 'handy')}<h1><em>Das Handy</em> anschließen</h1>
    <p class="lede">Einmal pro Handy. Android 8 oder neuer; ein H.265-Hardware-Encoder hilft, ist aber nicht nötig.</p>
    <div class="num"><i>1</i>USB-Debugging einschalten</div>
    <p>Einstellungen → Über das Telefon → siebenmal auf <b>Build-Nummer</b> tippen. Dann Einstellungen → System → <b>Entwickleroptionen</b> → <b>USB-Debugging</b>.</p>
    <div class="num"><i>2</i>An den USB-Port des Routers anschließen</div>
    <p>Ein Datenkabel, kein reines Ladekabel. RemoDroid auf dem Router findet das Handy von selbst und startet darauf einen kleinen Helfer (nichts aus dem Play Store).</p>
    <div class="num"><i>3</i>Den Router zulassen</div>
    <p>Das Handy fragt <b>„USB-Debugging zulassen?“</b>. Hake <b>Von diesem Computer immer zulassen</b> an, dann <b>Zulassen</b>. ${S.panel ? `<a href="${esc(S.panel)}/agent.html" target="_blank" rel="noopener">Der Agenten-Tab des Panels</a>` : 'Der Agenten-Tab des Panels'} zeigt das Handy als bereit.</p>`;
}

/* ---------- 4. RemoDroid for computers ---------- */
const DESK = {
  windows: { name: 'Windows', cpus: ['x86_64', 'aarch64'],
    files: cpu => [new RegExp(`^RemoDroid-(Computer-)?[0-9][^-]*-windows-${cpu === 'aarch64' ? 'arm64' : 'x86_64'}\\.zip$`)],
    steps: 'Irgendwo entpacken (die Dateien zusammen lassen) und <b>RemoDroid.exe</b> starten. Sein Symbol erscheint neben der Uhr. Windows 10 1809 oder neuer. Um auch Programme zu steuern, die als Administrator laufen, einmal <b>Control administrator windows…</b> in seinem Menü wählen.' },
  macos: { name: 'macOS', cpus: [],
    files: () => [/^RemoDroid-(Computer-)?[0-9][^-]*-macos\.zip$/],
    steps: 'Entpacken, <b>RemoDroid.app</b> in Programme ziehen und öffnen (beim ersten Mal: Rechtsklick → <b>Öffnen</b>). Es lebt in der Menüleiste. <b>Bildschirmaufnahme</b> und <b>Bedienungshilfen</b> erlauben, wenn es fragt, dann <b>Beenden und erneut öffnen</b>. macOS 13 oder neuer, Apple Silicon oder Intel.' },
  linux: { name: 'Linux', cpus: ['x86_64', 'aarch64'],
    files: cpu => [new RegExp(`^remodroid-desktop_.*_${cpu === 'aarch64' ? 'arm64' : 'amd64'}\\.deb$`), new RegExp(`^remodroid-desktop-.*\\.${cpu}\\.rpm$`),
      new RegExp(`^RemoDroid-(Computer-)?[0-9][^-]*-linux-${cpu}\\.AppImage$`)],
    steps: 'Das <code>.deb</code> oder <code>.rpm</code> installieren und <b>RemoDroid</b> aus dem App-Menü starten; auf anderen Distributionen das <code>.AppImage</code> ausführbar machen und starten. Braucht eine X11-Sitzung (unter GNOME: „GNOME on Xorg“ beim Anmelden).' },
};
function pageComputer() {
  const o = DESK[S.dos] || DESK.windows;
  const cpu = o.cpus.includes(S.dcpu) ? S.dcpu : o.cpus[0];
  main.innerHTML = `${eyebrow(4, 'computer')}<h1>RemoDroid für <em>Computer</em></h1>
    <p class="lede">Eine kleine App auf dem Computer, den du steuern willst. Sie verbindet sich selbst mit deinem Panel: kein offener Port, keine öffentliche Adresse.</p>
    <div class="seg">${Object.entries(DESK).map(([k, v]) => `<button type="button" data-dos="${k}" aria-selected="${k === S.dos}">${v.name}</button>`).join('')}</div>
    ${o.cpus.length ? `<div class="seg">${o.cpus.map(k => `<button type="button" data-dcpu="${k}" aria-selected="${k === cpu}">${CPU[k]}</button>`).join('')}</div>` : ''}
    <div class="num"><i>1</i>Herunterladen</div>
    <div id="ddl"><p class="note">Suche die neueste Version…</p></div>
    <div class="num"><i>2</i>Installieren und starten</div>
    <p>${o.steps}</p>
    <p class="note">Dann verbinde sie mit deinem Panel: der nächste Schritt.</p>`;
  main.querySelectorAll('[data-dos]').forEach(b => b.onclick = () => { S.dos = b.dataset.dos; save(); pageComputer(); });
  main.querySelectorAll('[data-dcpu]').forEach(b => b.onclick = () => { S.dcpu = b.dataset.dcpu; save(); pageComputer(); });
  fillFiles($('#ddl'), o.files(cpu));
}

/* ---------- 5. pair the computer with the panel ---------- */
function pagePair() {
  main.innerHTML = `${eyebrow(5, 'verbinden')}<h1><em>Den Computer</em> koppeln</h1>
    <p class="lede">Der Computer tritt deinem Panel mit einer Einmalzeile bei, die nur dein Panel erzeugen kann.</p>
    ${S.panel ? '' : panelField('panel')}
    <div class="num"><i>1</i>Die Zeile im Panel erzeugen</div>
    <p id="padd"></p>
    <p>Im Panel: <b>Agenten</b> → <b>Hinzufügen</b> → <b>Computer</b>. Es zeigt eine Zeile mit einem Einmalcode, <b>10 Minuten</b> gültig, und einen Kopierknopf.</p>
    <div class="num"><i>2</i>Auf dem Computer einfügen</div>
    <p>Klick auf das RemoDroid-Symbol (neben der Uhr oder in der Menüleiste des Macs) → <b>Pair with a panel…</b>, füge die ganze Zeile ein und klick <b>Pair</b>. Steht dort <b>Paired</b>, zeigt das Panel den Computer online.</p>
    <p class="note">Kein Bildschirm oder kein Tray? Führe die Zeile stattdessen im Terminal aus: <code>remodroid-desktopd pair --panel … --code …</code>, dann <code>remodroid-desktopd</code>.</p>`;
  const link = () => { $('#padd').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/panel.html#agents/add" target="_blank" rel="noopener">${esc(S.panel.replace(/^https?:\/\//, ''))} → Hinzufügen öffnen ↗</a>` : ''; };
  if (!S.panel) bindPanel('panel', () => pagePair());
  link();
}

/* ---------- done ---------- */
function pageDone() {
  const phone = S.target === 'phone';
  main.innerHTML = `${eyebrow(STEPS.length, 'fertig')}<h1>Zeit zum <em>${phone ? 'Spielen' : 'Verbinden'}</em></h1>
    <p class="lede">Öffne dein Panel in Safari auf dem iPhone, melde dich an, dann <b>Teilen</b> → <b>Zum Home-Bildschirm</b> für Vollbild. Tippe auf dein ${phone ? 'Handy' : 'Computer'}, um dich zu verbinden.</p>
    ${phone ? `<dl class="kv"><dt>Berührung</dt><dd>Multitouch geht direkt ans Handy; die schwebende Kugel öffnet das Menü.</dd>
      <dt>Qualität</dt><dd>Menü → Einstellungen: Auflösung, Bildrate, Bitrate, H.265 oder H.264.</dd>
      <dt>Fotos</dt><dd>Menü → Foto: vom iPhone in die Galerie des Handys.</dd>
      <dt>Zwischenablage</dt><dd>Text in beide Richtungen; ein Tipp unter HTTPS.</dd></dl>`
    : `<dl class="kv"><dt>Maus</dt><dd>Tippen zum Klicken, oder das Trackpad im Menü einschalten: Der Zeiger bewegt sich wie am Laptop.</dd>
      <dt>Tastatur</dt><dd>Menü → Tastatur; 🌐 wechselt die Eingabemethode des Computers (Chinesisch und Co.).</dd>
      <dt>Dateien</dt><dd>Dateien auf den Viewer ziehen, und sie landen in Downloads/RemoDroid auf dem Computer.</dd>
      <dt>Zwischenablage</dt><dd>Kopierter Text wird in beide Richtungen abgeglichen.</dd></dl>`}
    <p style="margin-top:26px">${S.panel ? `<a class="btn" href="${esc(S.panel)}/" target="_blank" rel="noopener">Dein Panel öffnen ↗</a> ` : ''}<a class="btn ghost" href="#step1" id="another">Auch ${phone ? 'einen Computer' : 'ein Handy'} hinzufügen</a> <a class="btn ghost" href="https://github.com/yinyue123/RemoDroid/blob/main/doc/de/README.md" target="_blank" rel="noopener">Doku lesen ↗</a></p>`;
  $('#another').onclick = e => { e.preventDefault(); S.target = phone ? 'computer' : 'phone'; save(); go(3); };
}

go(step);
})();
</script>
</body>
</html>
