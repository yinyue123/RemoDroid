<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-label="The RemoDroid Server window: administrator login, web port and domain, STUN/TURN, then Save and restart">
<style>
svg{--bg:#F7F4EE;--card:#FFFDF9;--card2:#EFE9DF;--line:#D6CDBE;--ink:#1E1C19;--muted:#7C746A;--accent:#B4553A;--soft:#F3E2D9;--ok:#3C7A46;--oksoft:#E1EEDD;--term:#1F1E1B}
@media (prefers-color-scheme:dark){svg{--bg:#16140F;--card:#1C1A15;--card2:#26221B;--line:#3A352B;--ink:#EEE8DC;--muted:#A39A8C;--accent:#E0805F;--soft:#3A2419;--ok:#86C37A;--oksoft:#1E2E1C;--term:#0E0D0B}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:13px;fill:var(--ink)}
.m{fill:var(--muted)}.a{fill:var(--accent)}.ok{fill:var(--ok)}.b{font-weight:600}.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.c2{fill:var(--card2)}.ln{stroke:var(--line);stroke-width:1.2;fill:none}
.hl{fill:var(--soft);stroke:var(--accent);stroke-width:1.8}.w{fill:#fff}
</style>
<rect x="1" y="1" width="698" height="518" rx="9" class="card"/><path d="M1 10a9 9 0 0 1 9-9h680a9 9 0 0 1 9 9v26H1z" class="c2"/><rect x="14" y="10" width="16" height="16" rx="4" fill="#13171C"/><rect x="19" y="12.5" width="6" height="11" rx="1.5" fill="none" stroke="#6CC8EE" stroke-width="1.3"/><text x="38" y="23" font-size="12.5">RemoDroid Server</text><path d="M588 18h10M636 13l10 10M646 13l-10 10" stroke="var(--muted)" stroke-width="1.3"/><text x="24" y="72" class="b" font-size="20">RemoDroid Server</text><circle cx="30" cy="94" r="5" fill="var(--ok)"/><text x="42" y="98.5" class="ok b" font-size="13">Running</text><rect x="24" y="112" width="96" height="28" rx="5" class="card"/><text x="72.0" y="130.5" font-size="12.5" text-anchor="middle">Open panel</text><rect x="128" y="112" width="56" height="28" rx="5" class="card"/><text x="156.0" y="130.5" font-size="12.5" text-anchor="middle">Stop</text><rect x="192" y="112" width="70" height="28" rx="5" class="card"/><text x="227.0" y="130.5" font-size="12.5" text-anchor="middle">Restart</text><rect x="270" y="112" width="82" height="28" rx="5" class="card"/><text x="311.0" y="130.5" font-size="12.5" text-anchor="middle">Show log</text><path d="M24 160H676" class="ln"/><g transform="translate(34 184)"><circle r="11" fill="var(--accent)"/><text x="0" y="4.5" class="w b" font-size="12" text-anchor="middle">1</text></g><text x="54" y="189" class="b" font-size="14">Administrator (signs in to the web panel)</text><text x="54" y="224" class="m" font-size="12.5">Username</text><rect x="140" y="206" width="170" height="28" rx="5" class="card"/><text x="149" y="224.5" class="mono" font-size="12.5">admin</text><text x="360" y="224" class="m" font-size="12.5">Password</text><rect x="440" y="206" width="170" height="28" rx="5" class="card"/><text x="449" y="224.5" class="mono" font-size="12.5">••••••••</text><path d="M24 260H676" class="ln"/><g transform="translate(34 284)"><circle r="11" fill="var(--accent)"/><text x="0" y="4.5" class="w b" font-size="12" text-anchor="middle">2</text></g><text x="54" y="289" class="b" font-size="14">Web panel and HTTPS</text><text x="54" y="324" class="m" font-size="12.5">Web port</text><rect x="140" y="306" width="80" height="28" rx="5" class="card"/><text x="149" y="324.5" class="mono" font-size="12.5">5580</text><text x="360" y="324" class="m" font-size="12.5">Domain</text><rect x="440" y="306" width="236" height="28" rx="5" class="card"/><text x="449" y="324.5" class="mono" font-size="12.5">rd.example.com</text><text x="54" y="360" class="m" font-size="12">Domain is optional: it gets free HTTPS from Let’s Encrypt.</text><path d="M24 380H676" class="ln"/><g transform="translate(34 404)"><circle r="11" fill="var(--accent)"/><text x="0" y="4.5" class="w b" font-size="12" text-anchor="middle">3</text></g><text x="54" y="409" class="b" font-size="14">STUN / TURN relay</text><rect x="54" y="426" width="16" height="16" rx="3.5" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.6"/><path d="M57.5 434.5l3 3 6-6.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="439" font-size="12.5">Built-in STUN/TURN server (UDP)</text><text x="330" y="439" class="m" font-size="12.5">Public IPv4</text><rect x="410" y="421" width="140" height="28" rx="5" class="card"/><text x="419" y="439.5" class="mono" font-size="12.5">203.0.113.10</text><rect x="522" y="468" width="154" height="34" rx="6" class="hl"/><text x="599" y="490" class="a b" font-size="13.5" text-anchor="middle">Save and restart</text><g transform="translate(522 468)"><circle r="11" fill="var(--accent)"/><text x="0" y="4.5" class="w b" font-size="12" text-anchor="middle">4</text></g><path transform="translate(640 484)" d="M0 0v17l4.6-4.2 3.1 7 2.8-1.2-3.1-6.9h6.3z" fill="#fff" stroke="#1E1C19" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
