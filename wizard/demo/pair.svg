<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" role="img" aria-label="On the computer: click the RemoDroid icon, Pair with a panel, paste the line, Pair">
<style>
svg{--bg:#F7F4EE;--card:#FFFDF9;--card2:#EFE9DF;--line:#D6CDBE;--ink:#1E1C19;--muted:#7C746A;--accent:#B4553A;--soft:#F3E2D9;--ok:#3C7A46;--oksoft:#E1EEDD;--term:#1F1E1B}
@media (prefers-color-scheme:dark){svg{--bg:#16140F;--card:#1C1A15;--card2:#26221B;--line:#3A352B;--ink:#EEE8DC;--muted:#A39A8C;--accent:#E0805F;--soft:#3A2419;--ok:#86C37A;--oksoft:#1E2E1C;--term:#0E0D0B}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:13px;fill:var(--ink)}
.m{fill:var(--muted)}.a{fill:var(--accent)}.ok{fill:var(--ok)}.b{font-weight:600}.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}.c2{fill:var(--card2)}.ln{stroke:var(--line);stroke-width:1.2;fill:none}
.hl{fill:var(--soft);stroke:var(--accent);stroke-width:1.8}.w{fill:#fff}
</style>
<g transform="translate(0 16)"><rect x="0" y="0" width="250" height="36" rx="8" class="c2"/><text x="236" y="23" class="m" font-size="12.5" text-anchor="end">10:42</text><g transform="translate(140 7)"><rect width="22" height="22" rx="5" fill="#13171C"/><rect x="7.5" y="3.5" width="7" height="15" rx="2" fill="none" stroke="#6CC8EE" stroke-width="1.5"/></g><g transform="translate(151 18)"><circle r="17" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".55"/><circle r="10" fill="var(--accent)" opacity=".22"/></g><g transform="translate(170 0)"><circle r="11" fill="var(--accent)"/><text x="0" y="4.5" class="w b" font-size="12" text-anchor="middle">1</text></g><rect x="40" y="46" width="210" height="132" rx="10" class="card"/><text x="56" y="72" class="m" font-size="12">RemoDroid — not paired</text><path d="M50 84H240" class="ln"/><rect x="48" y="92" width="194" height="30" rx="6" class="hl"/><text x="58" y="112" class="a b" font-size="13">Pair with a panel…</text><g transform="translate(242 92)"><circle r="11" fill="var(--accent)"/><text x="0" y="4.5" class="w b" font-size="12" text-anchor="middle">2</text></g><text x="58" y="145" font-size="13">Open panel</text><text x="58" y="168" font-size="13">Quit</text><path d="M256 108H294" stroke="var(--accent)" stroke-width="2" fill="none" stroke-dasharray="4 5"/><path d="M287 102l8 6-8 6" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="1" width="418" height="300" rx="10" class="card"/><path d="M300 11a10 10 0 0 1 10-10h398a10 10 0 0 1 10 10v22H300z" class="c2"/><text x="314" y="22" font-size="12">RemoDroid</text><text x="318" y="64" class="b" font-size="15">Pair this computer with your panel</text><text x="318" y="96" class="m" font-size="12">Pairing command</text><rect x="318" y="104" width="382" height="34" rx="6" class="hl"/><text x="328" y="126" class="mono" font-size="11.5">remodroid-desktopd pair --panel https://rd.examp…</text><g transform="translate(614 146)"><rect width="86" height="28" rx="6" fill="var(--term)"/><text x="43" y="19" class="w b" font-size="12" text-anchor="middle">Ctrl/⌘ + V</text></g><g transform="translate(614 146)"><circle r="11" fill="var(--accent)"/><text x="0" y="4.5" class="w b" font-size="12" text-anchor="middle">3</text></g><text x="318" y="196" class="m" font-size="12">Name</text><rect x="318" y="204" width="200" height="28" rx="5" class="card"/><text x="327" y="222.5" class="mono" font-size="12.5">my-laptop</text><rect x="614" y="250" width="86" height="34" rx="6" fill="var(--accent)"/><text x="657" y="272" class="w b" font-size="14" text-anchor="middle">Pair</text><g transform="translate(614 250)"><circle r="11" fill="var(--accent)"/><text x="0" y="4.5" class="w b" font-size="12" text-anchor="middle">4</text></g><path transform="translate(688 274)" d="M0 0v17l4.6-4.2 3.1 7 2.8-1.2-3.1-6.9h6.3z" fill="#fff" stroke="#1E1C19" stroke-width="1.3" stroke-linejoin="round"/><rect x="300" y="314" width="418" height="40" rx="10" fill="var(--oksoft)" stroke="var(--ok)" stroke-width="1.5"/><path d="M318 334l6 6 12-13" stroke="var(--ok)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="346" y="339" class="ok b" font-size="13.5">Paired as “my-laptop”.</text></g>
</svg>
