<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" aria-label="On the phone: tick Always allow from this computer, then Allow">
<style>
svg{--bg:#F7F4EE;--card:#FFFDF9;--card2:#EFE9DF;--line:#D6CDBE;--ink:#1E1C19;--muted:#7C746A;--accent:#B4553A;--soft:#F3E2D9;--ok:#3C7A46;--oksoft:#E1EEDD;--term:#1F1E1B}
