ize="16">←</text><text x="508" y="62" class="b" font-size="16">Developer options</text><rect x="470" y="80" width="210" height="44" rx="12" class="c2"/><text x="482" y="107" font-size="11.5">Use developer options</text><rect x="636" y="92" width="34" height="20" rx="10" fill="var(--accent)"/><circle cx="660" cy="102" r="7.5" fill="#fff"/><text x="482" y="171" font-size="13.5">Stay awake</text><rect x="636" y="156" width="34" height="20" rx="10" fill="var(--line)"/><circle cx="646" cy="166" r="7.5" fill="#fff"/><rect x="470" y="198" width="210" height="52" rx="10" class="hl"/><text x="482" y="229" class="b" font-size="13.5">USB debugging</text><rect x="636" y="214" width="34" height="20" rx="10" fill="var(--accent)"/><circle cx="660" cy="224" r="7.5" fill="#fff"/><text x="482" y="287" font-size="13.5">Wireless debugging</text><rect x="636" y="272" width="34" height="20" rx="10" fill="var(--line)"/><circle cx="646" cy="282" r="7.5" fill="#fff"/><g transform="translate(653 224)"><circle r="17" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".55"/><circle r="10" fill="var(--accent)" opacity=".22"/></g><g transform="translate(468 18)"><circle r="11" fill="var(--accent)"/><text x="0" y="4.5" class="w b" font-size="12" text-anchor="middle">2</text></g>
