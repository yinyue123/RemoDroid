<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Instalar o RemoDroid</title>
<meta name="description" content="Controle um celular Android ou um computador Windows, Mac ou Linux pelo iPhone: monte um painel (no Cloudflare, num servidor Linux ou num servidor Windows) e depois o RemoDroid no que você quer controlar.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/setup.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./"><i>RD</i>RemoDroid</a>
  <span class="spacer"></span>
  <select class="link" aria-label="Idioma" onchange="location.href=this.value" style="appearance:none;-webkit-appearance:none;background:none;cursor:pointer"><option value="/">English</option><option value="/zh/">简体中文</option><option value="/ja/">日本語</option><option value="/ko/">한국어</option><option value="/es/">Español</option><option value="/pt-BR/" selected>Português (Brasil)</option><option value="/de/">Deutsch</option><option value="/fr/">Français</option><option value="/ru/">Русский</option></select>
  <a class="link" href="https://github.com/yinyue123/RemoDroid/blob/main/doc/pt-BR/README.md" target="_blank" rel="noopener">Documentação ↗</a>
</header>
<nav class="steps" id="steps" aria-label="Etapas da instalação"></nav>
<main id="main" aria-live="polite"></main>
<footer class="foot">
  <button class="back" id="back" type="button">← Voltar</button>
  <span class="left" id="left"></span>
  <button class="btn" id="next" type="button">Próximo →</button>
</footer>
<script>
(() => {
'use strict';
const SITE = location.origin.startsWith('http') && !/^(localhost|127\.)/.test(location.hostname) ? location.origin : 'https://remodroid.pages.dev';
const REPO = 'yinyue123/RemoDroid';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const main = $('#main');
const COPY = '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
const hl = s => esc(s).replace(/(\s)(--?[a-zA-Z-]+)/g, '$1<span class="f">$2</span>').replace(/(\|)/g, '<span class="f">$1</span>');
const cmd = t => `<div class="cmd"><code>${hl(t)}</code><button type="button" aria-label="Copiar" data-copy="${esc(t)}">${COPY}</button></div>`;
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); } catch (_) {
    const ta = document.createElement('textarea'); ta.value = b.dataset.copy; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (__) {} ta.remove();
  }
  b.classList.add('ok'); b.innerHTML = '✓'; setTimeout(() => { b.classList.remove('ok'); b.innerHTML = COPY; }, 1400);
});

/* remembered between visits: what you control, where the panel is, which OS */
let S = { target: 'phone', server: 'cf', os: 'openwrt', dos: '' };
try { Object.assign(S, JSON.parse(localStorage.getItem('rd-install') || '{}')); } catch (_) {}
const save = () => { try { localStorage.setItem('rd-install', JSON.stringify(S)); } catch (_) {} };

if (!['cf', 'self', 'win'].includes(S.server)) S.server = 'cf';
if (!S.dos) S.dos = /Mac/.test(navigator.platform) ? 'macos' : /Linux/.test(navigator.platform) && !/Android/.test(navigator.userAgent) ? 'linux' : 'windows';
const PANEL_ON = { cf: 'Cloudflare', self: 'um servidor Linux', win: 'um servidor Windows' };
/* the steps follow from the two answers on the first page */
const stepsFor = () => [
  { label: 'Início', sub: 'Escolher', page: pageStart },
  { label: 'Painel', sub: 'Instalar', page: pageServer },
  { label: 'Painel', sub: 'Abrir', page: pagePanel },
  ...(S.target === 'phone'
    ? [{ label: 'Roteador', sub: 'Instalar', page: pageAgent }, { label: 'Conectar', sub: 'Registrar', page: pageConnect }, { label: 'Celular', sub: 'USB', page: pagePhone }]
    : [{ label: 'Computador', sub: 'Instalar', page: pageComputer }, { label: 'Conectar', sub: 'Parear', page: pagePair }]),
  { label: 'Pronto', sub: 'Usar', page: pageDone },
];
let STEPS = stepsFor();
/* "remodroid.example.com" / "http://1.2.3.4:5580/" → "https://remodroid.example.com" / "http://1.2.3.4:5580" */
function panelUrl(v) {
  v = String(v || '').trim().replace(/\/+$/, '').replace(/\/(wizard|agent)\.html.*$/, '');
  if (!v) return '';
  if (!/^https?:\/\//.test(v)) v = (/^[\d.]+(:\d+)?$/.test(v) ? 'http://' : 'https://') + v;
  return v;
}
const panelField = id => `<div class="form" style="margin-top:6px"><div class="field"><label for="${id}">Endereço do seu painel</label>
  <input id="${id}" type="text" inputmode="url" spellcheck="false" autocomplete="url" placeholder="https://remodroid.example.com  ou  http://203.0.113.10:5580" value="${esc(S.panel || '')}">
  <div class="hint">Fica guardado aqui para as próximas etapas.</div></div></div>`;
function bindPanel(id, after) {
  const el = document.getElementById(id);
  el.addEventListener('change', () => { S.panel = panelUrl(el.value); el.value = S.panel; save(); if (after) after(); });
}
let step = Math.min(+(location.hash.match(/^#step(\d)$/) || [0, 1])[1] - 1, STEPS.length - 1);
if (!(step >= 0)) step = 0;

function renderSteps() {
  $('#steps').innerHTML = STEPS.map((s, i) => `${i ? `<span class="bar${i <= step ? ' done' : ''}"></span>` : ''}<button class="st${i === step ? ' on' : i < step ? ' done' : ''}" type="button" data-i="${i}"><span class="n">${i < step ? '✓' : i + 1}</span><span><b>${s.label}</b><small>${s.sub}</small></span></button>`).join('');
  $('#steps').querySelectorAll('[data-i]').forEach(b => b.onclick = () => go(+b.dataset.i));
  $('#back').disabled = step === 0;
  const left = STEPS.length - 1 - step;
  $('#left').textContent = left ? `mais ${left} etapa${left > 1 ? 's' : ''}` : 'tudo pronto';
  $('#next').hidden = step === STEPS.length - 1;
}
function go(i) { STEPS = stepsFor(); step = i; history.replaceState(null, '', '#step' + (i + 1)); renderSteps(); STEPS[i].page(); window.scrollTo(0, 0); }
$('#back').onclick = () => go(Math.max(0, step - 1));
$('#next').onclick = () => go(Math.min(STEPS.length - 1, step + 1));
const eyebrow = (n, t) => `<p class="eyebrow">${String(n).padStart(2, '0')} — ${t}</p>`;

/* ---------- release assets (for "download the package") ---------- */
let assets = null;
async function loadAssets() {
  if (assets) return assets;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
    const j = await r.json();
    assets = { tag: j.tag_name, list: (j.assets || []).map(a => ({ name: a.name, url: a.browser_download_url, size: a.size })) };
  } catch (_) { assets = { tag: '', list: [] }; }
  return assets;
}
const MB = n => (n / 1048576).toFixed(1) + ' MB';
async function fillFiles(el, res) {
  const a = await loadAssets();
  const hits = a.list.filter(x => res.some(re => re.test(x.name)));
  el.innerHTML = hits.length ? hits.map(x => `<a class="btn" style="margin:0 10px 10px 0" href="${esc(x.url)}"><span>Baixar</span><small style="font:12px var(--mono);opacity:.7">${esc(x.name)} · ${MB(x.size)}</small></a>`).join('')
    : `<p class="note">Nada disso em ${esc(a.tag || 'a versão mais recente')}. Veja <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">todos os arquivos</a>.</p>`;
}
async function fillDownloads(el, who, os, cpu) {
  const a = await loadAssets();
  const re = {
    openwrt: new RegExp(`^remodroid-${who}_.*_(${cpu === 'x86_64' ? 'x86_64' : cpu === 'aarch64' ? 'aarch64_[a-z0-9-]+' : cpu === 'armv7' ? 'arm_[a-z0-9_-]+' : cpu === 'mipsel' ? 'mipsel_24kc' : cpu === 'mips' ? 'mips_24kc' : 'i386_pentium4'})\\.ipk$`),
    debian: new RegExp(`^remodroid-${who}_.*_${{ x86_64: 'amd64', aarch64: 'arm64', armv7: 'armhf', x86: 'i386' }[cpu] || 'none'}\\.deb$`),
    rhel: new RegExp(`^remodroid-${who}-.*\\.${{ x86_64: 'x86_64', aarch64: 'aarch64', armv7: 'armv7hl', x86: 'i686' }[cpu] || 'none'}\\.rpm$`),
    alpine: new RegExp(`^remodroid-${who}_.*_${{ x86_64: 'x86_64', aarch64: 'aarch64', armv7: 'armv7', x86: 'x86' }[cpu] || 'none'}\\.apk$`),
  }[os];
  const hits = a.list.filter(x => re.test(x.name));
  el.innerHTML = hits.length ? hits.map(x => `<a class="btn" style="margin:0 10px 10px 0" href="${esc(x.url)}"><span>Baixar</span><small style="font:12px var(--mono);opacity:.7">${esc(x.name)} · ${MB(x.size)}</small></a>`).join('')
    : `<p class="note">Não há pacote para esta combinação em ${esc(a.tag || 'a versão mais recente')}. Veja <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">todos os arquivos</a> (o <code>.tar.gz</code> roda em qualquer Linux).</p>`;
}

const OS = {
  openwrt: { name: 'OpenWrt', agent: `wget -qO- ${SITE}/install_agent.sh | sh`, install: 'opkg install ./remodroid-agent_*.ipk', cpus: ['mipsel', 'mips', 'armv7', 'aarch64', 'x86_64'] },
  debian: { name: 'Debian · Ubuntu', agent: `curl -fsSL ${SITE}/install_agent.sh | sudo sh`, install: 'sudo apt install ./remodroid-*.deb', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
  rhel: { name: 'CentOS · Fedora', agent: `curl -fsSL ${SITE}/install_agent.sh | sudo sh`, install: 'sudo dnf install ./remodroid-*.rpm', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
  alpine: { name: 'Alpine', agent: `wget -qO- ${SITE}/install_agent.sh | sh`, install: 'apk add --allow-untrusted ./remodroid-*.apk', cpus: ['x86_64', 'aarch64', 'armv7', 'x86'] },
};
/* starting what a package installed */
const SERVER_START = {
  debian: 'sudo systemctl enable --now remodroid-server',
  rhel: 'sudo systemctl enable --now remodroid-server',
  alpine: 'rc-update add remodroid-server && rc-service remodroid-server start',
};
const AGENT_START = {
  openwrt: '/etc/init.d/remodroid-agent enable && /etc/init.d/remodroid-agent start',
  debian: 'sudo systemctl enable --now remodroid-agent',
  rhel: 'sudo systemctl enable --now remodroid-agent',
  alpine: 'rc-update add remodroid-agent && rc-service remodroid-agent start',
};
const CPU = { mipsel: 'MIPS (LE)', mips: 'MIPS (BE)', armv7: 'ARMv7', aarch64: 'ARM64', x86_64: 'x86_64', x86: 'x86' };

/* ---------- 1. start: what you control, where the panel goes ---------- */
function pageStart() {
  const t = S.target, sv = S.server;
  main.innerHTML = `${eyebrow(1, 'início')}<h1>Duas <em>perguntas</em></h1>
    <p class="lede">O RemoDroid tem duas partes: um <b>painel</b>, a página web em que você faz login, e o <b>RemoDroid no que você controla</b>. Depois você usa pelo Safari do iPhone, ou qualquer navegador, sem instalar nada ali.</p>
    <div class="num"><i>1</i>O que você quer controlar?</div>
    <div class="choices">
      <button class="choice" type="button" data-t="phone" aria-pressed="${t === 'phone'}"><small>RemoDroid para celulares</small><b>Um celular Android</b><span>Ligado por USB ao seu roteador (OpenWrt, ASUS Merlin ou qualquer máquina Linux). Nada é instalado no celular.</span></button>
      <button class="choice" type="button" data-t="computer" aria-pressed="${t === 'computer'}"><small>RemoDroid para computadores</small><b>Um computador</b><span>Windows 10 ou 11, um Mac (macOS 13+) ou um PC com Linux. Um app pequeno no próprio computador.</span></button>
    </div>
    <div class="num"><i>2</i>Onde o painel vai rodar?</div>
    <div class="choices">
      <button class="choice" type="button" data-s="cf" aria-pressed="${sv === 'cf'}"><small>Sem servidor</small><b>Cloudflare</b><span>Grátis: o Cloudflare hospeda a página e retransmite o vídeo quando uma rede bloqueia a conexão direta. Alguns minutos no navegador.</span></button>
      <button class="choice" type="button" data-s="self" aria-pressed="${sv === 'self'}"><small>Auto-hospedado</small><b>Um servidor Linux</b><span>Uma VPS com IP público, de preferência perto de casa. Um comando; relay TURN próprio.</span></button>
      <button class="choice" type="button" data-s="win" aria-pressed="${sv === 'win'}"><small>Auto-hospedado</small><b>Um servidor Windows</b><span>Windows Server 2019+, ou Windows 10/11 com IP público. Descompacte e clique em Install.</span></button>
    </div>
    <p class="note">Seu plano: o painel em <b>${PANEL_ON[sv]}</b>, depois <b>${t === 'phone' ? 'o RemoDroid para celulares no seu roteador' : 'o RemoDroid para computadores no seu computador'}</b>, e então abra no iPhone. Um painel atende quantos celulares e computadores você quiser: volte aqui para adicionar o outro tipo.</p>`;
  main.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.target = b.dataset.t; save(); go(0); });
  main.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.server = b.dataset.s; save(); go(0); });
}

/* ---------- 2. the panel: install it where you chose ---------- */
const change = () => `<p class="note">Painel em <b>${PANEL_ON[S.server]}</b>. <a href="#step1" data-go="0">Mudar</a></p>`;
function pageServer() {
  const self = S.server === 'self';
  main.innerHTML = `${eyebrow(2, 'painel')}<h1>Instale o <em>painel</em></h1>
    <p class="lede">O painel é onde seus ${S.target === 'phone' ? 'roteadores' : 'computadores'} e seu iPhone se encontram: uma página web com o seu login.</p>
    ${change()}<div id="detail"></div>`;
  main.querySelector('[data-go]').onclick = e => { e.preventDefault(); go(0); };
  const d = $('#detail');
  if (S.server === 'win') {
    d.innerHTML = `<div class="num"><i>1</i>Baixe</div>
      <div class="seg" id="wcpu">${['x86_64', 'aarch64'].map(k => `<button type="button" data-cpu="${k}" aria-selected="${(S.wcpu || 'x86_64') === k}">${CPU[k]}</button>`).join('')}</div>
      <div id="wdl"><p class="note">Procurando a versão mais recente…</p></div>
      <div class="num"><i>2</i>Instale e inicie</div>
      <p>Descompacte numa pasta onde ele possa ficar, rode o <b>RemoDroidServer.exe</b> e escolha <b>Install and start</b>. Ele roda o painel como serviço do Windows, que inicia com o Windows com ou sem alguém logado, e o libera no Firewall do Windows. O ícone fica ao lado do relógio.</p>
      <p class="note">Pelo prompt de comando (como administrador): <code>remodroid-server install</code></p>
      <div class="chips"><small>Libere no firewall da sua nuvem</small><span class="chip">TCP 80 · 443 (domínio)</span><span class="chip">UDP 3478</span><span class="chip">UDP 49152–49252</span></div>`;
    d.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.wcpu = b.dataset.cpu; save(); pageServer(); });
    fillFiles($('#wdl'), [new RegExp(`^RemoDroid-Server-.*-windows-${(S.wcpu || 'x86_64') === 'aarch64' ? 'arm64' : 'x86_64'}\\.zip$`)]);
  } else if (self) {
    const one = `curl -fsSL ${SITE}/install_server.sh | sudo sh`;
    d.innerHTML = `<div class="num"><i>1</i>Uma linha — em qualquer Linux</div>
      <p class="bullet">Baixa, instala e inicia o servidor, tudo de uma vez.</p>
      ${cmd(one)}
      <div class="term"><div><span class="p">$</span> ${esc(one)}</div><div class="d">▸ baixando remodroid-server_…_amd64.deb</div><div class="d">▸ iniciando o serviço</div><div class="k">✓ o servidor está rodando. Abra o assistente:</div><div>    http://203.0.113.10:5580/wizard.html?token=d93kss5mrwsc</div></div>
      <p class="note">Guarde o link que ele mostra: a próxima etapa o abre.</p>
      <div class="num"><i class="alt">2</i>Ou instale um pacote</div>
      <div class="seg" id="sos">${['debian', 'rhel', 'alpine'].map(k => `<button type="button" data-os="${k}" aria-selected="${(S.sos || 'debian') === k}">${OS[k].name}</button>`).join('')}</div>
      <div class="seg" id="scpu">${['x86_64', 'aarch64'].map(k => `<button type="button" data-cpu="${k}" aria-selected="${(S.scpu || 'x86_64') === k}">${CPU[k]}</button>`).join('')}</div>
      <div id="sdl"><p class="note">Procurando a versão mais recente…</p></div>
      ${cmd(OS[S.sos || 'debian'].install.replace('remodroid-', 'remodroid-server').replace('-*', '*'))}
      <div class="num"><i class="alt">3</i>Inicie</div>
      <p class="bullet">Um pacote só instala o servidor. Inicie-o e faça-o voltar depois de reiniciar:</p>
      ${cmd(SERVER_START[S.sos || 'debian'])}
      <p>Depois abra <code>http://&lt;ip-do-servidor&gt;:5580/wizard.html</code>. O código de configuração está em <code>/var/lib/remodroid/setup-token</code>; a porta é <code>listen</code> em <code>/etc/remodroid/server.ini</code>.</p>`;
    d.querySelectorAll('[data-os]').forEach(b => b.onclick = () => { S.sos = b.dataset.os; save(); pageServer(); });
    d.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.scpu = b.dataset.cpu; save(); pageServer(); });
    fillDownloads($('#sdl'), 'server', S.sos || 'debian', S.scpu || 'x86_64');
  } else {
    const deploy = `git clone https://github.com/${REPO} && cd RemoDroid/worker\nnpm install && npx wrangler deploy`;
    d.innerHTML = `<div class="num"><i>1</i>Crie uma chave TURN</div>
      <p>O Cloudflare retransmite o vídeo quando uma rede bloqueia conexões diretas (1.000 GB por mês grátis). No <a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">painel do Cloudflare</a>: <b>Realtime</b> → <b>TURN Server</b> → <b>Create</b>. Guarde o <b>Turn Token ID</b> e o <b>API Token</b> para a próxima etapa.</p>
      <div class="num"><i>2</i>Publique o Worker</div>
      <p class="bullet">Num computador com Node.js: ele pede login no Cloudflare uma vez.</p>
      ${cmd(deploy)}
      <div class="term"><div><span class="p">$</span> npx wrangler deploy</div><div class="d">▸ Enviado remodroid (arquivos web, Durable Object "Hub")</div><div class="k">✓ Publicado: https://remodroid.&lt;você&gt;.workers.dev</div></div>
      <p class="note">Ou sem terminal: faça um fork de <a href="https://github.com/${REPO}" target="_blank" rel="noopener">${REPO}</a> e no painel do Cloudflare <b>Workers &amp; Pages</b> → <b>Create</b> → <b>Import a repository</b> → escolha seu fork → <b>Root directory: worker</b> → Deploy. A partir daí, cada push no seu fork atualiza o painel sozinho. O armazenamento (o banco de dados do Durable Object) é criado sozinho.</p>`;
  }
}

/* ---------- 3. panel: run it, open it, finish its setup ---------- */
function pagePanel() {
  const self = S.server === 'self';
  if (S.server === 'win') {
    main.innerHTML = `${eyebrow(3, 'painel')}<h1>Abra o seu <em>painel</em></h1>
      <p class="lede">A janela do RemoDroid Server na máquina Windows configura o painel; depois ele é uma página web em que você faz login de qualquer lugar.</p>
      <div class="num"><i>1</i>Configure na janela</div>
      <p>No <b>RemoDroidServer.exe</b>: o login do <b>administrador</b>, a <b>porta web</b>, um <b>domínio</b> para HTTPS grátis do Let's Encrypt (opcional) e <b>STUN/TURN</b>. A mesma janela inicia e para o painel e mostra o log.</p>
      <div class="num"><i>2</i>Abra</div>
      <p>De qualquer lugar: <code>https://&lt;seu domínio&gt;</code>, ou <code>http://&lt;ip-do-servidor&gt;:&lt;porta web&gt;</code> sem domínio.</p>
      <div class="num"><i class="alt">3</i>Onde ele está agora?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  } else if (self) {
    main.innerHTML = `${eyebrow(3, 'painel')}<h1>Abra o seu <em>painel</em></h1>
      <p class="lede">O servidor é o painel: uma página web no seu servidor em que você faz login e adiciona o que controla.</p>
      <div class="num"><i>1</i>Rode o servidor</div>
      <p class="bullet">O instalador de uma linha já o iniciou. Instalou um pacote você mesmo? Inicie agora:</p>
      ${cmd('sudo systemctl enable --now remodroid-server')}
      <p class="note">Alpine: <code>rc-update add remodroid-server &amp;&amp; rc-service remodroid-server start</code> · verifique: <code>systemctl status remodroid-server</code> (Alpine: <code>rc-service remodroid-server status</code>)</p>
      <div class="num"><i>2</i>Abra a página web</div>
      <p>Abra o link que o instalador mostrou: <code>http://&lt;ip-do-servidor&gt;:5580/wizard.html?token=…</code>. O <b>token</b> prova que o servidor é seu. Perdeu o link? Leia o token no servidor:</p>
      ${cmd('sudo cat /var/lib/remodroid/setup-token')}
      <div class="chips"><small>Libere antes</small><span class="chip">TCP 5580</span><span class="chip">TCP 80 · 443 (domínio)</span><span class="chip">UDP 3478</span><span class="chip">UDP 49152–49252</span></div>
      <div class="num"><i>3</i>Conclua o assistente</div>
      <p>Ele pede <b>um domínio</b> (HTTPS grátis do Let's Encrypt, renovado sozinho), <b>seu login</b> e a <b>porta STUN/TURN</b>, grava <code>/etc/remodroid/server.ini</code> e reinicia o servidor no seu endereço. Depois a mesma página, protegida pela sua senha, edita as configurações.</p>
      <div class="num"><i class="alt">4</i>Onde ele está agora?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  } else {
    main.innerHTML = `${eyebrow(3, 'painel')}<h1>Abra o seu <em>painel</em></h1>
      <p class="lede">O seu Worker é o painel: uma página web em que você faz login e adiciona o que controla.</p>
      <div class="num"><i>1</i>Abra o seu Worker</div>
      <p>O endereço aparece no <code>wrangler deploy</code> e no painel do Cloudflare: <b>Workers &amp; Pages</b> → <b>remodroid</b> → <b>Visit</b>. Normalmente <code>https://remodroid.&lt;você&gt;.workers.dev</code>.</p>
      <div class="num"><i>2</i>Conclua o assistente</div>
      <p>Ele pede <b>seu login</b> e a <b>chave TURN</b> da etapa anterior (ou outros servidores STUN/TURN). Quer um endereço próprio? Worker → <b>Settings</b> → <b>Domains &amp; Routes</b> → adicione um domínio personalizado.</p>
      <div class="callout">Faça isso logo depois de publicar: até lá, o primeiro visitante escolhe o login. Por segurança, dê antes ao Worker um secret <code>SETUP_TOKEN</code> (Settings → Variables and Secrets → Add, tipo <b>Secret</b>; uma variável comum se perde na próxima publicação); a página de configuração vai pedi-lo.</div>
      <div class="num"><i class="alt">3</i>Onde ele está?</div>
      ${panelField('panel')}
      <p id="open"></p>`;
  }
  const open = () => { $('#open').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/" target="_blank" rel="noopener">Abrir ${esc(S.panel.replace(/^https?:\/\//, ''))} ↗</a>` : ''; };
  bindPanel('panel', open);
  open();
}

/* ---------- 4. RemoDroid for phones, on the router ---------- */
function pageAgent() {
  const o = OS[S.os];
  const cpu = o.cpus.includes(S.cpu) ? S.cpu : o.cpus[0];
  main.innerHTML = `${eyebrow(4, 'roteador')}<h1>RemoDroid para <em>celulares</em></h1>
    <p class="lede">Roda no roteador em que o celular está ligado (ou em qualquer máquina Linux com porta USB) e se conecta sozinho ao seu painel. Sem porta aberta nem endereço público; nada vai para o próprio celular.</p>
    <div class="seg">${Object.entries(OS).map(([k, v]) => `<button type="button" data-os="${k}" aria-selected="${k === S.os}">${v.name}</button>`).join('')}</div>
    <div class="num"><i>1</i>Um comando</div>
    <p class="bullet">Baixa, instala e inicia, tudo de uma vez. Rode no roteador (SSH).</p>
    ${cmd(o.agent)}
    <div class="term"><div><span class="p">$</span> ${esc(o.agent)}</div><div class="d">▸ baixando remodroid-agent_…_${S.os === 'openwrt' ? 'mipsel_24kc.ipk' : 'amd64.deb'}</div><div class="d">▸ iniciando o serviço</div><div class="k">✓ rodando</div></div>
    <div class="num"><i class="alt">2</i>Ou baixe o pacote</div>
    <div class="seg">${o.cpus.map(k => `<button type="button" data-cpu="${k}" aria-selected="${k === cpu}">${CPU[k]}</button>`).join('')}</div>
    <div id="adl"><p class="note">Procurando a versão mais recente…</p></div>
    ${cmd(o.install.replace('remodroid-*', 'remodroid-agent*').replace('remodroid-agent_*', 'remodroid-agent_*'))}
    <div class="num"><i class="alt">3</i>Inicie</div>
    <p class="bullet">Um pacote só instala. Inicie e faça voltar depois de reiniciar:</p>
    ${cmd(AGENT_START[S.os])}
    <p class="note">Depois conecte ao seu painel: a próxima etapa.</p>
    <div class="chips"><small>Precisa de</small><span class="chip">uma porta USB</span><span class="chip">${S.os === 'openwrt' ? 'ca-bundle (instalado junto)' : 'ca-certificates'}</span><span class="chip">relógio certo (HTTPS)</span></div>
    <p class="note">ASUS Merlin com Koolshare: pegue o <code>remodroid-…-merlin-….tar.gz</code> na <a href="https://github.com/${REPO}/releases/latest" target="_blank" rel="noopener">versão mais recente</a> e instale em Software Center → Manual installation.</p>`;
  main.querySelectorAll('[data-os]').forEach(b => b.onclick = () => { S.os = b.dataset.os; save(); pageAgent(); });
  main.querySelectorAll('[data-cpu]').forEach(b => b.onclick = () => { S.cpu = b.dataset.cpu; save(); pageAgent(); });
  fillDownloads($('#adl'), 'agent', S.os, cpu);
}

/* ---------- 5. connect: the code comes from your panel ---------- */
function pageConnect() {
  main.innerHTML = `${eyebrow(5, 'conectar')}<h1>Registre <em>o roteador</em></h1>
    <p class="lede">O roteador entra no seu painel com um código de uso único que só o seu painel pode criar.</p>
    ${S.panel ? '' : panelField('panel')}
    <div class="num"><i>1</i>Abra a aba Agentes do painel</div>
    <p id="routers"></p>
    <div class="num"><i>2</i>Adicione um agente</div>
    <p>Esse link abre <b>Adicionar um agente → Conectar</b> (ou clique você mesmo). O painel mostra um código como <code>X5SX-K3M7</code>: uso único, válido por <b>10 minutos</b>. Lá a página tem o comando completo com botão de copiar; ou digite o código aqui.</p>
    <div class="form"><div class="field"><label for="code">Código do seu painel</label><input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="9" style="font-family:var(--mono);letter-spacing:.08em"></div></div>
    <div class="num"><i>3</i>Rode no roteador</div>
    <div id="enroll"></div>
    <div class="term" id="term"></div>
    <p class="note">Quando aparecer <b>bound</b>, a página do painel também fica verde. Daí em diante as configurações de vídeo, celular e área de transferência do roteador ficam na aba Agentes do painel, sem editar ini.</p>`;
  const draw = () => {
    const code = ($('#code').value || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
    const c = code.length === 8 ? code.slice(0, 4) + '-' + code.slice(4) : '';
    const p = S.panel || 'https://your.panel';
    const line = `remodroid enroll --panel ${p} --code ${c || 'XXXX-XXXX'}`;
    $('#routers').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/agent.html#connect" target="_blank" rel="noopener">Abrir ${esc(S.panel.replace(/^https?:\/\//, ''))}/agent.html ↗</a>`
      : 'Digite acima o endereço do painel, ou abra-o você mesmo e vá em <b>Agentes → Adicionar</b>.';
    $('#enroll').innerHTML = c && S.panel ? cmd(line) : `<div class="cmd"><code style="color:var(--faint)">${esc(line)}</code></div><p class="note">${S.panel ? 'Digite acima o código do painel.' : 'Digite o endereço do painel e o código.'}</p>`;
    $('#term').innerHTML = `<div><span class="p">$</span> ${esc(line)}</div><div class="d">▸ contatando o painel ${esc(p)}…</div><div class="d">▸ registrado como "OpenWrt" (openwrt); salvo em /etc/remodroid/agent.ini</div><div class="k">✓ bound — este roteador está online</div>`;
  };
  $('#code').addEventListener('input', draw);
  if (!S.panel) bindPanel('panel', () => pageConnect());
  draw();
}

/* ---------- 6. phone ---------- */
function pagePhone() {
  main.innerHTML = `${eyebrow(6, 'celular')}<h1>Ligue <em>o celular</em></h1>
    <p class="lede">Uma vez por celular. Android 8 ou mais novo; um codificador H.265 por hardware ajuda, mas não é necessário.</p>
    <div class="num"><i>1</i>Ative a depuração USB</div>
    <p>Configurações → Sobre o telefone → toque em <b>Número da versão</b> sete vezes. Depois Configurações → Sistema → <b>Opções do desenvolvedor</b> → <b>Depuração USB</b>.</p>
    <div class="num"><i>2</i>Ligue na porta USB do roteador</div>
    <p>Um cabo de dados, não um só de carga. O RemoDroid no roteador encontra o celular sozinho e inicia nele um pequeno ajudante (nada da Play Store).</p>
    <div class="num"><i>3</i>Permita o roteador</div>
    <p>O celular pergunta <b>“Permitir depuração USB?”</b>. Marque <b>Sempre permitir neste computador</b> e depois <b>Permitir</b>. ${S.panel ? `<a href="${esc(S.panel)}/agent.html" target="_blank" rel="noopener">A aba Agentes do painel</a>` : 'A aba Agentes do painel'} mostra o celular como pronto.</p>`;
}

/* ---------- 4. RemoDroid for computers ---------- */
const DESK = {
  windows: { name: 'Windows', cpus: ['x86_64', 'aarch64'],
    files: cpu => [new RegExp(`^RemoDroid-(Computer-)?[0-9][^-]*-windows-${cpu === 'aarch64' ? 'arm64' : 'x86_64'}\\.zip$`)],
    steps: 'Descompacte onde quiser (mantenha os arquivos juntos) e rode o <b>RemoDroid.exe</b>. O ícone aparece ao lado do relógio. Windows 10 1809 ou mais novo. Para controlar também programas que rodam como administrador, escolha uma vez <b>Control administrator windows…</b> no menu dele.' },
  macos: { name: 'macOS', cpus: [],
    files: () => [/^RemoDroid-(Computer-)?[0-9][^-]*-macos\.zip$/],
    steps: 'Descompacte, mova o <b>RemoDroid.app</b> para Aplicativos e abra (na primeira vez: clique com o botão direito → <b>Abrir</b>). Ele fica na barra de menus. Permita <b>Gravação de Tela</b> e <b>Acessibilidade</b> quando pedir e depois <b>Sair e Reabrir</b>. macOS 13 ou mais novo, Apple silicon ou Intel.' },
  linux: { name: 'Linux', cpus: ['x86_64', 'aarch64'],
    files: cpu => [new RegExp(`^remodroid-desktop_.*_${cpu === 'aarch64' ? 'arm64' : 'amd64'}\\.deb$`), new RegExp(`^remodroid-desktop-.*\\.${cpu}\\.rpm$`),
      new RegExp(`^RemoDroid-(Computer-)?[0-9][^-]*-linux-${cpu}\\.AppImage$`)],
    steps: 'Instale o <code>.deb</code> ou o <code>.rpm</code> e abra o <b>RemoDroid</b> pelo menu de aplicativos; em outras distribuições torne o <code>.AppImage</code> executável e rode. Precisa de uma sessão X11 (no GNOME: “GNOME on Xorg” no login).' },
};
function pageComputer() {
  const o = DESK[S.dos] || DESK.windows;
  const cpu = o.cpus.includes(S.dcpu) ? S.dcpu : o.cpus[0];
  main.innerHTML = `${eyebrow(4, 'computador')}<h1>RemoDroid para <em>computadores</em></h1>
    <p class="lede">Um app pequeno no computador que você quer controlar. Ele se conecta sozinho ao seu painel: sem porta aberta nem endereço público.</p>
    <div class="seg">${Object.entries(DESK).map(([k, v]) => `<button type="button" data-dos="${k}" aria-selected="${k === S.dos}">${v.name}</button>`).join('')}</div>
    ${o.cpus.length ? `<div class="seg">${o.cpus.map(k => `<button type="button" data-dcpu="${k}" aria-selected="${k === cpu}">${CPU[k]}</button>`).join('')}</div>` : ''}
    <div class="num"><i>1</i>Baixe</div>
    <div id="ddl"><p class="note">Procurando a versão mais recente…</p></div>
    <div class="num"><i>2</i>Instale e inicie</div>
    <p>${o.steps}</p>
    <p class="note">Depois conecte ao seu painel: a próxima etapa.</p>`;
  main.querySelectorAll('[data-dos]').forEach(b => b.onclick = () => { S.dos = b.dataset.dos; save(); pageComputer(); });
  main.querySelectorAll('[data-dcpu]').forEach(b => b.onclick = () => { S.dcpu = b.dataset.dcpu; save(); pageComputer(); });
  fillFiles($('#ddl'), o.files(cpu));
}

/* ---------- 5. pair the computer with the panel ---------- */
function pagePair() {
  main.innerHTML = `${eyebrow(5, 'conectar')}<h1>Pareie <em>o computador</em></h1>
    <p class="lede">O computador entra no seu painel com uma linha de uso único que só o seu painel pode criar.</p>
    ${S.panel ? '' : panelField('panel')}
    <div class="num"><i>1</i>Crie a linha no painel</div>
    <p id="padd"></p>
    <p>No painel: <b>Agentes</b> → <b>Adicionar</b> → <b>Computador</b>. Ele mostra uma linha com um código de uso único, válida por <b>10 minutos</b>, e um botão de copiar.</p>
    <div class="num"><i>2</i>Cole no computador</div>
    <p>Clique no ícone do RemoDroid (ao lado do relógio, ou na barra de menus do Mac) → <b>Pair with a panel…</b>, cole a linha inteira e clique em <b>Pair</b>. Quando aparecer <b>Paired</b>, o painel mostra o computador online.</p>
    <p class="note">Sem tela ou sem bandeja? Rode a linha num terminal: <code>remodroid-desktopd pair --panel … --code …</code>, depois <code>remodroid-desktopd</code>.</p>`;
  const link = () => { $('#padd').innerHTML = S.panel ? `<a class="btn" href="${esc(S.panel)}/panel.html#agents/add" target="_blank" rel="noopener">Abrir ${esc(S.panel.replace(/^https?:\/\//, ''))} → Adicionar ↗</a>` : ''; };
  if (!S.panel) bindPanel('panel', () => pagePair());
  link();
}

/* ---------- done ---------- */
function pageDone() {
  const phone = S.target === 'phone';
  main.innerHTML = `${eyebrow(STEPS.length, 'pronto')}<h1>Hora de <em>${phone ? 'jogar' : 'conectar'}</em></h1>
    <p class="lede">Abra o painel no Safari do iPhone, faça login e toque em <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b> para tela cheia. Toque no seu ${phone ? 'celular' : 'computador'} para conectar.</p>
    ${phone ? `<dl class="kv"><dt>Toque</dt><dd>O multitoque vai direto ao celular; a bolinha flutuante abre o menu.</dd>
      <dt>Qualidade</dt><dd>Menu → Configurações: resolução, taxa de quadros, bitrate, H.265 ou H.264.</dd>
      <dt>Fotos</dt><dd>Menu → Foto: do iPhone para a Galeria do celular.</dd>
      <dt>Área de transferência</dt><dd>Texto nos dois sentidos; um toque com HTTPS.</dd></dl>`
    : `<dl class="kv"><dt>Mouse</dt><dd>Toque para clicar, ou ligue o trackpad no menu: o ponteiro se move como num notebook.</dd>
      <dt>Teclado</dt><dd>Menu → Teclado; 🌐 troca o método de entrada do computador (chinês e outros).</dd>
      <dt>Arquivos</dt><dd>Solte arquivos no visualizador e eles vão para Downloads/RemoDroid no computador.</dd>
      <dt>Área de transferência</dt><dd>O texto copiado sincroniza nos dois sentidos.</dd></dl>`}
    <p style="margin-top:26px">${S.panel ? `<a class="btn" href="${esc(S.panel)}/" target="_blank" rel="noopener">Abrir o painel ↗</a> ` : ''}<a class="btn ghost" href="#step1" id="another">Adicionar também ${phone ? 'um computador' : 'um celular'}</a> <a class="btn ghost" href="https://github.com/yinyue123/RemoDroid/blob/main/doc/pt-BR/README.md" target="_blank" rel="noopener">Ler a documentação ↗</a></p>`;
  $('#another').onclick = e => { e.preventDefault(); S.target = phone ? 'computer' : 'phone'; save(); go(3); };
}

go(step);
})();
</script>
</body>
</html>
